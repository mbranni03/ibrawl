<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ibrawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #26231f; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="sketch.js"></script>
<script src="clawd.js"></script>
<script src="moveset.js"></script>
<script>
const W = 1280, H = 720, STEP = 1 / 60;
const cv = document.getElementById('c'); ctx = cv.getContext('2d');
const dpr = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * dpr; cv.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
const paper = makePaper(W, H, dpr);

// ---------- arena ----------
const stage = { x: 240, y: 500, w: 800, h: 110 }; // solid collision box
const stagePoly = [[240, 500], [1040, 500], [1040, 530], [960, 610], [320, 610], [240, 530]];
const plats = [{ x: 330, y: 375, w: 210 }, { x: 740, y: 375, w: 210 }, { x: 535, y: 255, w: 210 }]; // pass-through
const SPIKES = { x: 955, y: 484, w: 75, h: 16, dmg: 12, kb: { base: 60, growth: 60, angle: 70 } }; // hazard on the stage's right side
const BLAST = { l: -220, r: W + 220, t: -360, b: H + 200 };

// ---------- player ----------
const G = 2300, RUN = 440, DASH = 600, WALK = 190, CRAWL = 110, JUMP = 930, HOP = 640, AIRJUMP = 820;
const TURN_SPEED = 1.4; // turnaround plays this much faster than a plain brake
// attack feel: presses are remembered for BUFFER frames; the last CANCEL share of a move's recovery can be cut short by any input;
// a move that connects recovers in HIT_REC of the time (and can jump out right away); hits freeze both sides for a few frames
const BUFFER = 8, CANCEL = 0.4, HIT_REC = 0.6, ATK_FRICTION = 1400;
const TILT_MS = 150; // forward tilt needs ← / → pressed within this long of light; a direction you're just holding (walking) still jabs
const ATTACK_FROM = ['idle', 'walk', 'dash', 'run', 'skid', 'crouch', 'crouchWalk', 'crouchUp', 'land', 'shield'];
// shield: holding it wears it down, letting go lets it grow back; blocking a hit costs a chunk. Emptied = it breaks (stun), and comes back at SHIELD_MIN
const SHIELD_DRAIN = 1 / 240, SHIELD_REGEN = 1 / 360, SHIELD_HIT = 0.3, SHIELD_MIN = 0.3;
let hitstop = 0;
const M = MOVESET.movement, L = MOVESET.ledge, JABS = ['jab1', 'jab2', 'jab3'];
const NO_KB = { base: 0, growth: 0, angle: 0 }; // damage only: the target stays put
const GR = MOVESET.grabs, THROWS = ['forwardThrow', 'backThrow', 'upThrow', 'downThrow']; // holding the bag: hold / pummel / throws
const SIDE_B = MOVESET.specials.sideSpecial, DOWN_B = MOVESET.specials.downSpecial; // usable on the ground and in the air, so they live in both maps
const ATK = { ...MOVESET.groundAttacks, ...MOVESET.smashAttacks, sideSpecial: SIDE_B, downSpecial: DOWN_B, grab: GR.grab, dashGrab: GR.dashGrab }, AIR = { ...MOVESET.aerials, sideSpecial: SIDE_B, downSpecial: DOWN_B }; // attack states are named after their move
const NEUTRAL_B = MOVESET.specials.neutralSpecial; // held charge, no hitbox yet
const US = MOVESET.specials.upSpecial; // MCP tether: its own state, runs off P.teth
const MOVES = { ...ATK, ...AIR, ledgeAttack: L.ledgeAttack, neutralSpecial: NEUTRAL_B, pummel: GR.pummel, ...Object.fromEntries(THROWS.map(k => [k, GR[k]])) };
const think = () => { setState('neutralSpecial'); P.f = thinkFrom(P.think); }; // resume from the last checkpoint reached
const R = MOVESET.reactions, RESPAWN_Y = 100; // respawn platform: where it stops (top of Claw'd's box)
const D = MOVESET.defense, DODGES = ['spotDodge', 'rollForward', 'rollBack'], AD = D.airDodge, SB = D.shieldBreak;
// dodges and the ledge roll list intangible = [first, last) frames where nothing can hurt Claw'd
const intangible = () => { const it = (L[P.state] || D[P.state] || R[P.state] || MOVES[P.state])?.intangible; return !!it && P.f >= it[0] && P.f < it[1]; };
// collision box = Claw'd's body + legs (the arm nubs overhang it)
const P = { x: 610, y: 380, w: 60, h: 50, vx: 0, vy: 0, ground: false, on: null, jumps: 1, face: 1, drop: 0, inv: 0, state: 'air', f: 0, fastFall: false, dmg: 0, hitT: 0, ledge: 0, regrab: 0, think: 0 }; // think = neutral special effort tier reached (0 … 3), kept until KO
const GROUNDED = ['idle', 'walk', 'dash', 'run', 'skid', 'crouch', 'crouchWalk', 'crouchUp', 'squat', 'land', 'landLag', 'shield', 'shieldDrop', 'knockdown', 'getup', 'tech', 'hold', 'pummel', ...THROWS, ...DODGES, ...Object.keys(ATK).filter(k => !(k in AIR))];
const STOCKS = 3; let stocks = STOCKS;
const fx = []; // dust clouds left in the world: { x, y, dir, t }
const shots = []; // thrown sparks in flight: { x, y, vx, t, m }
let sub = null; // the down special's subagent: a half-size Claw'd box { x, y, w, h, vx, vy, face, t, ground, on, done = seconds since it reported back }
// punching bag: a sack that takes hits and knockback like a fighter; respawns when it leaves the blast zone
const BAG_SPAWN = { x: 800, y: -120, vx: 0, vy: 0, dmg: 0, hitT: 0, rot: 0, hit: null, held: false, pinned: false }; // held = in Claw'd's claws · pinned = on the end of the up special's cord
const bag = { w: 44, h: 76, ground: false, on: null, ...BAG_SPAWN };
const KB = 10; // knockback units → px/s

const keys = {}; let jumpQ = false, downQ = false, ffQ = false, dashQ = false, attackQ = false, heavyQ = false, specialQ = false, dodgeQ = false, grabQ = 0, techQ = 0, techLock = 0, sideQ = false, lastTap = { a: null, t: 0 }, lastDir = 0, pressT = {}, attackT = -1e9, tiltQ = false;
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', Space: 'jump',
                 ArrowDown: 'down', KeyS: 'down', KeyC: 'attack', KeyJ: 'attack', KeyX: 'heavy', KeyK: 'heavy', KeyV: 'special', KeyL: 'special', KeyZ: 'dodge', ShiftLeft: 'dodge', ShiftRight: 'dodge', KeyI: 'shield', KeyG: 'grab', KeyU: 'grab' }; // brawlhalla light / heavy: C X (arrows) · J K (WASD); special: V / L; dodge: Z / Shift; shield: I
// ---------- pause menu ----------
const MENU = ['resume', 'controls', 'restart', 'quit'], HOME_MENU = ['play', 'characters', 'controls'];
const CONTROLS = [['← → / A D', 'walk · double-tap to run'], ['Space', 'jump · tap = short hop · x2 · ledge: ↑ / toward climb, ↓ / away let go'],
                  ['↓ / S', 'crouch (+ ← → crawl) · drop through · double-tap in the air: fast fall'],
                  ['C / J', 'light · jab combo · tap ← → with it = forward tilt · ↑ / ↓ tilts · running = dash attack · in the air: aerials (+ ← → ↑ ↓)'], ['X / K', 'heavy · hold to charge · + ↑ terminal uppercut · + ↓ /compact (hits both sides)'], ['V / L', 'special · + ← → throw a spark · + ↑ MCP tether: plugs into a nearby ledge and reels you in (+ ← → aims lower) · + ↓ send out a subagent · hold alone to think up to ultrathink: more damage + speed per tier, until KO (ground or air)'], ['I', 'hold: shield (terminal) · + ← → roll · + ↓ spot dodge · just before a tumble hits the ground: tech (+ ← → tech roll)'], ['knocked down', 'any key: get up · ← → roll away · C / X: getup attack (hits both sides)'], ['G / U', 'grab (running: dash grab) · holding: C / J pummel · ← → ↑ ↓ throw'], ['Shift / Z', 'dodge: spot dodge · + ← → roll · in the air: dodge any way (once per jump) · on a ledge: roll onto the stage'], ['Esc', 'pause']];
let paused = true, sel = 0, showControls = false, over = false, home = true, menu = HOME_MENU; // boots to the home screen
function setPaused(on) {
  paused = on; sel = 0; showControls = false; over = false; home = false; menu = MENU;
  for (const k in keys) keys[k] = false; jumpQ = downQ = ffQ = dashQ = attackQ = heavyQ = specialQ = dodgeQ = grabQ = techQ = techLock = false;
}
function gameOver() { setPaused(true); over = true; menu = ['restart', 'quit']; }
function goHome() { restart(); setPaused(true); home = true; menu = HOME_MENU; }
function restart() {
  stocks = STOCKS; fx.length = shots.length = 0; sub = null; Object.assign(bag, BAG_SPAWN);
  Object.assign(P, { x: 610, y: 380, vx: 0, vy: 0, ground: false, on: null, jumps: 1, face: 1, drop: 0, inv: 0, state: 'air', f: 0, fastFall: false, dmg: 0, hitT: 0, ledge: 0, regrab: 0, shield: 1, think: 0, toastT: null });
}
function choose(i) {
  if (menu[i] === 'controls') showControls = true;
  else if (menu[i] === 'quit') goHome();
  else if (menu[i] === 'characters') location.href = 'moves.html'; // storyboard of every move
  else { if (menu[i] !== 'resume') restart(); setPaused(false); } // play / restart start fresh
}
addEventListener('keydown', e => {
  if (e.code === 'Escape') { e.preventDefault(); if (showControls) showControls = false; else if (!over && !home) setPaused(!paused); return; }
  if (paused) {
    const a = KEYMAP[e.code], ok = e.code === 'Enter' || e.code === 'Space';
    if (showControls) { if (ok) showControls = false; }
    else if (a === 'up') sel = (sel + menu.length - 1) % menu.length;
    else if (a === 'down') sel = (sel + 1) % menu.length;
    else if (ok) choose(sel);
    else return;
    e.preventDefault(); return;
  }
  const a = KEYMAP[e.code]; if (!a) return;
  e.preventDefault();
  if (!keys[a]) {
    if (P.state === 'shieldBreak') P.f += 3; // mash out of the stun
    if (a === 'jump') jumpQ = BUFFER; // jump / attack / heavy stay queued for a few frames (see BUFFER)
    if (a === 'down') { downQ = true; if (lastTap.a === a && e.timeStamp - lastTap.t < 200) ffQ = true; pressT[a] = e.timeStamp; } // double-tap = fast fall, so ↓ can aim a down air freely
    if (a === 'attack') { attackQ = BUFFER; attackT = e.timeStamp; tiltQ = (keys.left || keys.right) && e.timeStamp - Math.max(pressT.left || 0, pressT.right || 0) < TILT_MS; }
    if (a === 'heavy') heavyQ = BUFFER;
    if (a === 'special') specialQ = BUFFER;
    if (a === 'dodge') dodgeQ = BUFFER;
    if (a === 'grab') grabQ = BUFFER;
    if ((a === 'dodge' || a === 'shield') && P.state === 'tumble' && !techLock) { techQ = R.tech.window; techLock = R.tech.lockout; } // teches a tumble that hits the ground within window frames
    if (a === 'left' || a === 'right') { // dash = a quick tap, then the same direction again right after (see keyup)
      lastDir = a === 'left' ? -1 : 1; sideQ = true; // fresh ← / → press (rolls out of shield)
      if (lastTap.a === a && e.timeStamp - lastTap.t < 200) dashQ = true;
      pressT[a] = e.timeStamp;
      if (e.timeStamp - attackT < TILT_MS) tiltQ = true; // direction landed just after light: still a tilt
    }
  }
  keys[a] = true;
});
addEventListener('keyup', e => {
  const a = KEYMAP[e.code]; if (!a) return;
  keys[a] = false;
  // only a short tap (< 150ms held) can start a dash / fast fall, so letting go of a held direction and pressing it again just walks
  if (a === 'left' || a === 'right' || a === 'down') lastTap = e.timeStamp - pressT[a] < 150 ? { a, t: e.timeStamp } : { a: null, t: 0 };
});
addEventListener('blur', () => { if (!over && !home) setPaused(true); });
// mouse: hover highlights, click picks (items drawn in drawPause)
function menuAt(e) {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  const i = Math.floor((y - (H / 2 - 26)) / 52);
  return paused && !showControls && Math.abs(x - W / 2) < 120 && i >= 0 && i < menu.length ? i : -1;
}
cv.addEventListener('mousemove', e => { const i = menuAt(e); if (i >= 0) sel = i; cv.style.cursor = i >= 0 ? 'pointer' : ''; });
cv.addEventListener('click', e => {
  if (paused && showControls) { showControls = false; return; }
  const i = menuAt(e); if (i >= 0) { choose(i); if (!paused) cv.style.cursor = ''; }
});

const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const setState = s => { if (P.state !== s) { P.state = s; P.f = 0; } };
const dust = (dx, dir) => fx.push({ x: P.x + P.w / 2 + dx, y: P.y + P.h, dir, t: 0 });
const puff = () => { dust(-26, -1); dust(26, 1); };

function land(surface, wasGround) {
  if (!wasGround) {
    P.fastFall = false;
    if (P.state === 'shieldBreak') puff(); // still stunned through the landing
    else if (P.state === 'tumble' || (P.state === 'airDodge' && P.fromTumble && techQ)) { // tech (+ ← → tech roll), else slammed onto its back (dodging out of a tumble right before landing still techs)
      const d = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      if (techQ) { techQ = dodgeQ = 0; setState(d ? (d === P.face ? 'rollForward' : 'rollBack') : 'tech'); } else setState('knockdown');
      puff();
    }
    else if (P.state === 'hitstun') {} // flinches through the landing
    else if (P.state in AIR || ['airDodge', 'upSpecial', 'specialFall'].includes(P.state)) { P.lag = (AIR[P.state] || (P.state === 'airDodge' ? AD : US)).landingLag; setState('landLag'); puff(); } // landed mid-aerial / mid-dodge / helpless (keeps its slide)
    else if (P.state === 'neutralSpecial') {} // keeps thinking through the landing
    else if (P.vy > 300) { setState('land'); puff(); } else setState('idle');
  }
  P.vy = 0; P.ground = true; P.on = surface; P.jumps = 2; P.airDodged = false;
}

// ledges: falling past a stage corner (not holding down) catches it. While on it, the ledge moves' x / air place Claw'd
// (measured from standing at the lip); P.ledge = which corner, -1 left / 1 right
function grabLedge() {
  if (P.regrab > 0 || keys.down || P.vy < 0 || !(['air', 'djump', 'upSpecial', 'specialFall'].includes(P.state) || (P.state === 'tumble' && P.f >= P.stun))) return;
  for (const side of [-1, 1]) {
    const lx = side < 0 ? stage.x : stage.x + stage.w, gap = side < 0 ? lx - (P.x + P.w) : P.x - lx;
    if (gap >= 0 && gap < 24 && P.y > stage.y - 40 && P.y < stage.y + 16) {
      Object.assign(P, { ledge: side, face: -side, fastFall: false, jumps: 1, airDodged: false }); // catching refreshes the double jump
      return setState('ledgeGrab');
    }
  }
}
function ledgeInput(dir) {
  const s = P.state;
  if (s === 'ledgeGrab' && P.f >= L.ledgeGrab.frames) setState('ledgeHang');
  else if (s === 'ledgeHang') {
    if (jumpQ) { jumpQ = 0; setState('ledgeJump'); }
    else if (dodgeQ) { dodgeQ = 0; setState('ledgeRoll'); }
    else if (attackQ || heavyQ) { attackQ = heavyQ = 0; setState('ledgeAttack'); }
    else if (keys.up || dir === P.face) setState('ledgeGetup');
    else if (keys.down || dir === -P.face) { P.ledge = 0; P.regrab = 0.4; setState('ledgeDrop'); }
  }
  else if (s === 'ledgeGetup' && P.f >= L.ledgeGetup.frames) { P.ledge = 0; P.ground = true; P.on = stage; P.jumps = 2; setState('idle'); }
  else if (s === 'ledgeJump' && P.f >= L.ledgeJump.launchAt) { P.ledge = 0; P.regrab = 0.4; P.vy = -JUMP; P.jumps = 1; setState('air'); }
  else if (s === 'ledgeRoll' && P.f >= L.ledgeRoll.frames) { P.ledge = 0; P.ground = true; P.on = stage; P.jumps = 2; setState('idle'); }
  else if (s === 'ledgeAttack' && P.f >= L.ledgeAttack.startup + L.ledgeAttack.active + L.ledgeAttack.endlag) { P.ledge = 0; P.ground = true; P.on = stage; P.jumps = 2; setState('idle'); }
  else if ((s === 'ledgeGetup' && P.f === 19) || (s === 'ledgeAttack' && P.f === 15) || (s === 'ledgeRoll' && P.f === 26)) puff(); // feet hit the stage
}
function ledgePlace() {
  const p = clawdPose(), lx = P.ledge < 0 ? stage.x : stage.x + stage.w;
  P.x = lx + P.face * (P.w / 2 + (p.x || 0)) - P.w / 2; P.y = stage.y + (p.air || 0) - P.h; P.vx = P.vy = 0;
}

// up special: fling the MCP cord. P.teth = { len px out, ang above level, side = ledge it's plugged into (0 = not yet), miss, hit }
function tetherUp(dir) {
  if (dir) P.face = dir; specialQ = 0;
  P.teth = { len: 0, ang: (dir ? US.aim[1] : US.aim[0]) * Math.PI / 180, side: 0, miss: false, link: null }; // link = frames since the plug went into the bag
  P.vy = Math.min(P.vy, -US.pop); P.vx *= 0.5; P.ground = false; P.on = null; P.fastFall = false; setState('upSpecial');
}
const hand = () => { const [hx, hy] = clawdHand(clawdPose(), P.face); return [P.x + P.w / 2 + hx, P.y + P.h + hy]; };
function tetherStep(dt) {
  const T = P.teth, [ax, ay] = hand();
  if (T.side) { // plugged in: reel straight to hanging from that ledge (where ledgePlace would put a fresh grab)
    const lx = T.side < 0 ? stage.x : stage.x + stage.w, g = L.ledgeGrab.anim(0);
    const tx = lx - T.side * (P.w / 2 + g.x) - P.w / 2, ty = stage.y + g.air - P.h, dx = tx - P.x, dy = ty - P.y, d = Math.hypot(dx, dy), step = US.reel * dt;
    P.vx = P.vy = 0;
    if (d > step) { P.x += dx / d * step; P.y += dy / d * step; return; }
    Object.assign(P, { x: tx, y: ty, ledge: T.side, face: -T.side, fastFall: false, jumps: 1, airDodged: false }); // catching refreshes the double jump
    return setState('ledgeGrab');
  }
  if (T.link != null) return linkStep(T, ax, ay, dt);
  if (P.f < US.startup) return;
  if (T.miss) { if ((T.len = Math.max(0, T.len - US.reach / US.endlag)) === 0) { setState('specialFall'); Object.assign(P, { toastT: 0, toastMsg: 2, toastOk: false }); } return; } // pull it back, then helpless (+ the "connection refused" toast)
  T.len = Math.min(US.reach, T.len + US.reach / US.active);
  const tx = ax + P.face * Math.cos(T.ang) * T.len, ty = ay - Math.sin(T.ang) * T.len, wall = overlaps({ x: tx - 1, y: ty - 1, w: 2, h: 2 }, stage);
  for (const side of [-1, 1]) { // a lip off to this side, within the cord and close enough to the aim, pulls the plug in (hitting the wall under it: any lip in reach)
    const lx = side < 0 ? stage.x : stage.x + stage.w, a = Math.atan2(ay - stage.y, P.face * (lx - ax));
    if (side * (P.x + P.w / 2 - lx) > 0 && Math.hypot(lx - ax, stage.y - ay) <= (wall ? US.reach : T.len) && (wall || Math.abs(a - T.ang) <= US.cone * Math.PI / 180)) { T.side = side; return; }
  }
  if (!bag.held && overlaps({ x: tx - 12, y: ty - 12, w: 24, h: 24 }, bag)) { // plugged into the bag: connected (see linkStep)
    T.link = 0; T.at = [Math.min(bag.w - 4, Math.max(4, tx - bag.x)), Math.min(bag.h - 8, Math.max(8, ty - bag.y))]; bag.pinned = true;
    hitBag(US.link.zapDmg, NO_KB, P.face); Object.assign(P, { toastT: 0, toastMsg: LINKED, toastOk: true }); return;
  }
  if (T.len >= US.reach || wall) T.miss = true; // nothing to plug into
}

// plugged into the bag: zap it a few times through the cord, reel it in, blast it away. Claw'd hangs on the cord meanwhile and comes
// out of it free (not helpless), popping up with its double jump back
function linkStep(T, ax, ay, dt) {
  const K = US.link, px = bag.x + T.at[0], py = bag.y + T.at[1];
  P.vx *= 0.9; P.vy = 0; bag.vx = bag.vy = 0;
  if (++T.link <= (K.zaps - 1) * K.every) { if (T.link % K.every === 0) hitBag(K.zapDmg, NO_KB, P.face); return; }
  const dx = ax - px, dy = ay - py, d = Math.hypot(dx, dy), step = K.reel * dt;
  if (d > K.near + step && T.link < K.zaps * K.every + 40) { bag.x += dx / d * step; bag.y += dy / d * step; return; } // (gives up reeling after a bit)
  bag.pinned = false; hitBag(US.damage, US.kb, P.face);
  Object.assign(P, { vy: -K.pop, jumps: Math.max(P.jumps, 1), airDodged: false }); setState('air');
}

// the shield ran out: the terminal shatters, Claw'd pops up and is left dizzy for SB.frames (each key press shakes off 3 frames)
function breakShield() {
  P.shield = 0; P.vy = -SB.pop; P.ground = false; P.on = null; hitstop = 10; setState('shieldBreak');
  P.oopsMsg = Math.floor(Math.random() * OOPS.length); // which error toast pops up over its head
}

// holding the bag: light pummels, a direction throws; once P.holdT runs out it wriggles free and they're pushed apart
function grabBag() {
  Object.assign(bag, { held: true, vx: 0, vy: 0 }); P.holdT = GR.hold.breakFree + GR.hold.perDmg * bag.dmg; P.vx = 0; hitstop = 4; setState('hold');
}
function holdStep(dir) {
  if (--P.holdT <= 0) { Object.assign(bag, { held: false, vx: P.face * 300, vy: -250 }); P.vx = -P.face * 200; return setState('idle'); }
  if (P.state === 'pummel') {
    const m = GR.pummel;
    if (P.f === m.startup) hitBag(m.damage, NO_KB, P.face);
    if (P.f >= m.startup + m.active + m.endlag) setState('hold');
  }
  else if (attackQ) { attackQ = 0; setState('pummel'); }
  else if (P.f >= 4 && (dir || keys.up || keys.down)) setState(keys.up ? 'upThrow' : keys.down ? 'downThrow' : dir === P.face ? 'forwardThrow' : 'backThrow');
}
function throwStep() { // lets go on the startup frame
  const m = GR[P.state];
  if (P.f === m.startup) { bag.held = false; hitBag(m.damage, m.kb, P.state === 'backThrow' ? -P.face : P.face); }
  if (P.f >= m.startup + m.active + m.endlag) setState('idle');
}

// every hit on Claw'd: damage, a freeze, then launched away from the hit; knockback picks a flinch (hitstun) or a tumble
function hitClawd(dmg, kb, dir) {
  hurt(dmg); hitstop = Math.round(3 + dmg / 4);
  const k = kb.base + kb.growth * P.dmg / 100, a = kb.angle * Math.PI / 180;
  P.vx = dir * k * KB * Math.cos(a); P.vy = -k * KB * Math.sin(a); P.face = -dir; P.stun = Math.round(k * R.hitstun.perKb);

// which frame of which animation to show for the current state
function clawdPose() {
  const f = P.f, atk = MOVES[P.state];
  if (atk) { const p = atk.anim(f, undefined, atk.chargeFrames ? P.chg / atk.chargeFrames : 0); if (P.held && f === atk.chargeAt) p.x += P.chg % 4 < 2 ? 1.5 : -1.5; return p; } // tremble while charging
  switch (P.state) {
    case 'idle': return M.idle.anim(f % 120, 120);
    case 'walk': return M.walk.anim(f % 40, 40);
    case 'dash': return M.dash.anim(Math.min(f, 16), 20);
    case 'run': return M.run.anim(f % 24, 24);
    case 'skid': return M.skid.anim(Math.min(Math.floor(P.sk), P.turn ? 25 : 13), 26); // a plain brake holds before the flip
    case 'crouch': return M.crouch.anim(f < 50 ? f : 5 + (f - 5) % 45, 60); // loop the held part
    case 'crouchWalk': return M.crouchWalk.anim(f % 32, 32);
    case 'crouchUp': return M.crouch.anim(Math.min(50 + f, 59), 60);
    case 'squat': return M.jumpSquat.anim(Math.min(6, f * 1.5), 14);
    case 'land': return M.land.anim(Math.min(3 + f, 17), 18);
    case 'landLag': return M.land.anim(Math.min(3 + f * 14 / P.lag, 17), 18); // the landing squash stretched over the lag
    case 'drop': return M.platformDrop.anim(Math.min(8 + f, 30), 40);
    case 'djump': return M.doubleJump.anim(Math.min(3 + f, 28), 36);
    case 'ledgeGrab': return L.ledgeGrab.anim(Math.min(f, 10));
    case 'ledgeHang': return L.ledgeHang.anim(f % 60, 60);
    case 'ledgeGetup': return L.ledgeGetup.anim(Math.min(f, 24));
    case 'ledgeJump': return L.ledgeJump.anim(f);
    case 'ledgeRoll': return L.ledgeRoll.anim(Math.min(f, 35));
    case 'shield': case 'shieldDrop': { // the terminal shrinks a little, cracks and fades as the shield wears down
      const p = D.shield.anim(P.state === 'shieldDrop' ? Math.min(50 + f, 59) : f < 4 ? f : 4 + (f - 4) % 46);
      p.shield *= 0.75 + 0.25 * P.shield; p.wear = 1 - P.shield; return p;
    }
    case 'shieldBreak': return { ...SB.anim(Math.min(f, SB.frames - 1)), oopsMsg: P.oopsMsg };
    case 'airDodge': { const p = D[P.dodgeAnim].anim(Math.min(f, AD.frames - 1)); p.rot = (p.rot || 0) + P.dodgeTilt * Math.min(1, f / 3, Math.max(0, (AD.frames - f) / 10)); return p; }
    case 'spotDodge': case 'rollForward': case 'rollBack': return D[P.state].anim(Math.min(f, D[P.state].frames - 1));
    case 'ledgeDrop': return L.ledgeDrop.anim(Math.min(f, 16));
    case 'upSpecial': { // the cord: out along its aim, or taut to the lip it's plugged into
      const T = P.teth, p = T.side || T.link != null ? { ...US.reelPose } : US.anim(Math.min(f, US.startup + US.active + US.endlag - 1));
      delete p.tether; delete p.air;
      const [hx, hy] = clawdHand(p, P.face), ax = P.x + P.w / 2 + hx, ay = P.y + P.h + hy, lx = T.side < 0 ? stage.x : stage.x + stage.w;
      if (T.side) Object.assign(p, { tether: [Math.hypot(lx - ax, stage.y - ay), Math.atan2(ay - stage.y, P.face * (lx - ax))], plugged: true });
      else if (T.link != null) { const px = bag.x + T.at[0], py = bag.y + T.at[1]; Object.assign(p, { tether: [Math.hypot(px - ax, py - ay), Math.atan2(ay - py, P.face * (px - ax))], plugged: true, flow: T.link / 24 }); }
      else if (T.len) p.tether = [T.len, T.ang];
      return p;
    }
    case 'hold': return GR.hold.anim(f % 60, 60);
    case 'hitstun': return R.hitstun.anim(Math.min(f, P.stun - 1), P.stun);
    case 'tumble': return R.tumble.anim(f % 40, 40);
    case 'knockdown': return R.knockdown.anim(f);
    case 'getup': case 'tech': return R[P.state].anim(Math.min(f, R[P.state].frames - 1));
    case 'respawn': return { ...M.idle.anim(f % 120, 120), pad: 1, say: [R.respawn.say, Math.min(1, f / 10)] };
    case 'specialFall': return M.fall.anim(f % 40, 40); // helpless
  }
  if (P.fastFall) return M.fastFall.anim(f % 24, 24);
  if (P.vy > 450) return M.fall.anim(f % 40, 40);
  // rising / floating: pick the jump-arc frame from vertical speed (stretched going up, tucked at the peak, reaching down)
  return M.fullHop.anim(7 + 48 * Math.min(1, Math.max(0, (P.vy + JUMP) / (JUMP + 450))), 64);
}

// ---------- render ----------
function surfaceBelow() {
  const cx = P.x + P.w / 2, feet = P.y + P.h;
  let best = null;
  for (const s of [stage, ...plats]) if (cx > s.x && cx < s.x + s.w && s.y >= feet - 1 && (best === null || s.y < best)) best = s.y;
  return best;
}

function render(t) {
  seed = Math.floor(t * 8) * 7919 + 1;
  ctx.drawImage(paper, 0, 0, W, H);
  ctx.lineCap = ctx.lineJoin = 'round';

  // faint pencil background
  ctx.strokeStyle = INK; ctx.globalAlpha = 0.18; ctx.lineWidth = 1.5;
  ellipse(1040, 150, 62, 62, 2);
  line(40, 470, 330, 440, 3, 1); line(330, 440, 620, 468, 3, 1); line(700, 460, 1000, 430, 3, 1); line(1000, 430, 1240, 462, 3, 1);
  ctx.globalAlpha = 1;

  // main stage
  ctx.fillStyle = '#e3d9c6'; path(stagePoly); ctx.fill();
  ctx.strokeStyle = INK;
  hatch([[240, 532], [1040, 532], [960, 610], [320, 610]]);
  ctx.lineWidth = 2.6; poly(stagePoly, 1.6);
  ctx.lineWidth = 1.4; line(250, 512, 1030, 512, 1.2, 1);

  // spikes
  ctx.fillStyle = '#cfc4b0'; ctx.lineWidth = 2;
  for (let x = SPIKES.x; x < SPIKES.x + SPIKES.w; x += 15) {
    const tri = [[x, SPIKES.y + SPIKES.h], [x + 7.5, SPIKES.y], [x + 15, SPIKES.y + SPIKES.h]];
    path(tri); ctx.fill(); poly(tri, 0.6);
  }

  // platforms
  for (const pl of plats) {
    const r = [[pl.x, pl.y], [pl.x + pl.w, pl.y], [pl.x + pl.w - 8, pl.y + 12], [pl.x + 8, pl.y + 12]];
    ctx.fillStyle = '#e3d9c6'; path(r); ctx.fill();
    hatch(r, 9, 0.35);
    ctx.lineWidth = 2.2; poly(r, 1.3);
  }

  // shadow
  const sy = surfaceBelow();
  if (sy !== null && P.state !== 'ko') {
    const dist = sy - (P.y + P.h), s = Math.max(0.25, 1 - dist / 400);
    ctx.globalAlpha = 0.35 * s;
    ctx.fillStyle = 'rgba(42,38,34,0.35)';
    ctx.beginPath(); ctx.ellipse(P.x + P.w / 2, sy, 44 * s, 5 * s, 0, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
  }

  drawBag();
  if (sub) drawSub();
  for (const sh of shots) drawSpark(sh.x, sh.y, SPARK_R * Math.min(1, (sh.m.projectile.life - sh.t) / 0.1), sh.t * 14 * Math.sign(sh.vx)); // shrinks away at max range

  // player (flickers after respawn)
  for (const d of fx) drawDust(d.x, d.y, d.t, d.dir);
  // x / air in poses are preview-only root motion; here physics moves Claw'd
  if (P.state === 'ko') { const p = R.ko.anim(R.ko.blastAt + P.f); p.blast[1] = P.ko[2]; drawClawd(P.ko[0], P.ko[1] + 2.5 * CV, p); }
  else if (!(P.inv > 0 && Math.floor(t * 14) % 2)) { const pose = clawdPose(); ctx.globalAlpha = intangible() ? 0.5 : 1; drawClawd(P.x + P.w / 2, P.y + P.h, { ...pose, x: P.state in MOVES && !P.ledge ? pose.x : 0, ...powered(pose), ...toast() }, P.face); ctx.globalAlpha = 1; } // attacks lean and come back

  // hud
  drawHealth();
  if (paused) drawPause(t);
}

// the up special's toasts ("connection refused" on a miss, "mcp connected" plugging into the bag): stay up TOAST frames whatever
// Claw'd does next (landing, getting up…). P.toastMsg = OOPS index or [headline, detail], P.toastOk = success style
const TOAST = 150;
const toast = () => P.toastT == null ? {} : { oops: Math.min(1, P.toastT / 6, (TOAST - P.toastT) / 12), oopsMsg: P.toastMsg, oopsOk: P.toastOk };

// effort tiers stay on Claw'd until KO: its aura, and 5% more size per tier (the neutral special's own pose already has both)
function powered(pose) {
  if (!P.think || P.state === 'neutralSpecial') return {};
  const g = 1 + 0.05 * P.think;
  return { aura: P.think, sx: (pose.sx ?? 1) * g, sy: (pose.sy ?? 1) * g };
}

// the subagent: Claw'd at half size, popping in, running (or falling); once done just its toast, over where it poofed
function drawSub() {
  const S = DOWN_B.sub, bx = sub.x + sub.w / 2, by = sub.y + sub.h, fr = Math.floor(sub.t * 60);
  if (sub.done) return drawOops(bx, sub.y - 4, Math.min(1, sub.done / 0.1, (S.report - sub.done) / 0.2), DONE, true);
  const k = S.scale * Math.min(1, 0.4 + sub.t / 0.15), pose = sub.ground ? M.run.anim(fr % 24, 24) : M.fall.anim(fr % 40, 40);
  ctx.save(); ctx.translate(bx, by); ctx.scale(k, k); ctx.lineWidth = 2; drawClawd(0, 0, { ...pose, x: 0 }, sub.face); ctx.restore();
}

// the sack (clawd.js), shaking when hit, damage % floating above
function drawBag() {
  const sh = bag.hitT * 14, bx = bag.x + bag.w / 2 + (Math.random() - 0.5) * sh, by = bag.y + bag.h;
  drawSack(bx, by, bag.rot);
  ctx.font = '700 30px Caveat, cursive'; ctx.textAlign = 'center'; ctx.lineWidth = 3;
  const pct = Math.round(bag.dmg) + '%';
  ctx.strokeText(pct, bx, bag.y - 12); ctx.fillStyle = dmgColor(bag.dmg); ctx.fillText(pct, bx, bag.y - 12);
  ctx.textAlign = 'left';
}

function drawHealth() {
  const sh = P.hitT * 16, bx = W - 120 + (Math.random() - 0.5) * sh, by = 70 + (Math.random() - 0.5) * sh, R = 38; // shakes when hit
  ctx.fillStyle = dmgColor(P.dmg); ctx.beginPath(); ctx.arc(bx, by, R, 0, 6.28); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ellipse(bx, by, R, R, 1.2);
  ctx.save(); ctx.translate(bx, by); ctx.scale(0.8, 0.8); drawClawd(0, 5 * CV / 2); ctx.restore(); // centred inside
  // damage %, overlapping the circle's bottom right, filled with the same colour
  ctx.font = '700 36px Caveat, cursive'; ctx.lineWidth = 3.5; ctx.textAlign = 'left'; // grows rightward, away from the circle
  const pct = Math.round(P.dmg) + '%', tx = bx + 12, ty = by + R + 6;
  ctx.strokeText(pct, tx, ty); ctx.fillStyle = dmgColor(P.dmg); ctx.fillText(pct, tx, ty);
  // stocks: filled pip = life left, wrapping the circle's bottom-left quarter, starting at the bottom
  for (let i = 0; i < STOCKS; i++) {
    const a = Math.PI / 2 - 0.04 + i * 0.38, px = bx + (R + 11) * Math.cos(a), py = by + (R + 11) * Math.sin(a);
    if (i < stocks) { ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(px, py, 5, 0, 6.28); ctx.fill(); }
    ctx.lineWidth = 1.6; ellipse(px, py, 5, 5, 0.5);
  }
}

function drawPause(t) {
  // home: clean paper with ink; pause / game over: the frozen game dimmed with light text
  if (home) ctx.drawImage(paper, 0, 0, W, H);
  else { ctx.fillStyle = 'rgba(38,35,31,0.8)'; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = ctx.strokeStyle = home ? INK : '#efe7d6'; ctx.textAlign = 'center';
  if (home && !showControls) {
    ctx.save(); ctx.translate(W / 2, H / 2 - 52); ctx.scale(1.5, 1.5); drawClawd(0, 0, { ...M.idle.anim(Math.floor(t * 60) % 120, 120), x: 0 }); ctx.restore();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; line(W / 2 - 110, H / 2 - 50, W / 2 + 110, H / 2 - 50, 1.2, 1);
    ctx.fillStyle = INK;
  } else { ctx.font = '700 84px Caveat, cursive'; ctx.fillText(over ? 'game over' : showControls ? 'controls' : 'paused', W / 2, H / 2 - 70); }
  if (showControls) {
    ctx.font = '600 32px Caveat, cursive';
    CONTROLS.forEach(([k, d], i) => {
      const y = H / 2 - 5 + i * 42;
      ctx.textAlign = 'right'; ctx.globalAlpha = 1; ctx.fillText(k, W / 2 - 150, y);
      ctx.textAlign = 'left'; ctx.globalAlpha = 0.75; ctx.fillText(d, W / 2 - 110, y);
    });
    ctx.textAlign = 'center';
  } else {
    ctx.font = '600 40px Caveat, cursive';
    menu.forEach((m, i) => {
      ctx.globalAlpha = i === sel ? 1 : 0.5;
      ctx.fillText((i === sel ? '›  ' : '') + m + (i === sel ? '  ‹' : ''), W / 2, H / 2 + 10 + i * 52);
    });
  }
  ctx.globalAlpha = 0.6; ctx.font = '600 22px Caveat, cursive';
  ctx.fillText(showControls ? 'Esc / Enter / click  back' : '↑ ↓ choose · Enter / Space / click select' + (over || home ? '' : ' · Esc resume'), W / 2, H / 2 + 250);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  if (paused) acc = 0;
  while (!paused && acc >= STEP) { update(STEP); acc -= STEP; } // game over can pause mid-frame
  cv.style.translate = hitstop > 0 ? `${(Math.random() - 0.5) * 6}px ${(Math.random() - 0.5) * 6}px` : ''; // shake during hit freeze
  render(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
