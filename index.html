<body>
<canvas id="c"></canvas>
<script src="src/sketch.js"></script>
<script src="src/characters/clawd.js"></script>
<script src="src/characters/grok.js"></script>
<script src="src/characters/wumpus.js"></script>
<script src="src/characters/android.js"></script>
<script src="src/characters/duo.js"></script>
<script src="src/characters/snoo.js"></script>
<script src="src/characters/lego.js"></script>
<script src="src/characters/clawd-moveset.js"></script>
<script src="src/characters/grok-moveset.js"></script>
<script src="src/characters/duo-moveset.js"></script>
<script src="src/characters/snoo-moveset.js"></script>
<script>
const W = 1280, H = 720, STEP = 1 / 60;
const cv = document.getElementById('c'); ctx = cv.getContext('2d');
const dpr = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * dpr; cv.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
const paper = makePaper(W, H, dpr);

// ---------- arena ----------
const stage = { x: 240, y: 500, w: 800, h: 110 }; // solid collision box
const stagePoly = [[240, 500], [1040, 500], [1040, 530], [960, 610], [320, 610], [240, 530]];
const plats = [{ x: 330, y: 375, w: 210 }, { x: 740, y: 375, w: 210 }, { x: 535, y: 255, w: 210 }]; // pass-through
const BLAST = { l: -220, r: W + 220, t: -360, b: H + 200 };

// ---------- player ----------
const G = 2300, RUN = 440, DASH = 600, WALK = 190, CRAWL = 110, JUMP = 930, HOP = 640, AIRJUMP = 820;
const TURN_SPEED = 1.4; // turnaround plays this much faster than a plain brake
// attack feel: presses are remembered for BUFFER frames; the last CANCEL share of a move's recovery can be cut short by any input;
// a move that connects recovers in HIT_REC of the time (and can jump out right away); hits freeze both sides for a few frames
const BUFFER = 8, CANCEL = 0.4, HIT_REC = 0.6, ATK_FRICTION = 1400;
const TILT_MS = 150; // forward tilt needs ← / → pressed within this long of light; a direction you're just holding (walking) still jabs
const ATTACK_FROM = ['idle', 'walk', 'dash', 'run', 'skid', 'crouch', 'crouchWalk', 'crouchUp', 'land', 'shield'];
// shield: holding it wears it down, letting go lets it grow back; blocking a hit costs a chunk. Emptied = it breaks (stun), and comes back at SHIELD_MIN
const SHIELD_DRAIN = 1 / 240, SHIELD_REGEN = 1 / 360, SHIELD_HIT = 0.3, SHIELD_MIN = 0.3;
let hitstop = 0;
let p1 = null, fighter, M = MOVESET.movement; // P1's pick (null = not yet), the fighter in play (FIGHTER, set on the vs screen), its movement
const has = group => !!fighter.set[group];
const AIR_JUMPS = () => fighter.jumps || 1;
const JABS = ['jab1', 'jab2', 'jab3'];
const NO_KB = { base: 0, growth: 0, angle: 0 }; // damage only: the target stays put
const THROWS = ['forwardThrow', 'backThrow', 'upThrow', 'downThrow']; // holding the bag: hold / pummel / throws
const DODGES = ['spotDodge', 'rollForward', 'rollBack'];
// the fighter in play's moves, by group: its own, with any it hasn't made yet borrowed from Claw'd's (has() still switches whole groups off)
// SP = its specials by direction · FLY = rocket-style specials by state (the flight, and its charge: state + 'Charge')
let L, GR, SP, DOWN_B, ATK, AIR, NEUTRAL_B, US, MOVES, FLY, R, D, AD, SB;
function loadMoves(set) {
  const S = g => ({ ...MOVESET[g], ...set[g] });
  L = S('ledge'); GR = S('grabs'); R = S('reactions'); D = S('defense'); AD = D.airDodge; SB = D.shieldBreak;
  SP = S('specials'); NEUTRAL_B = SP.neutralSpecial; US = SP.upSpecial; // US = MCP tether: its own state, runs off P.teth
  DOWN_B = SP.downSpecial; // the subagent (sub), if it has one
  ATK = { ...S('groundAttacks'), ...S('smashAttacks'), grab: GR.grab, dashGrab: GR.dashGrab }; AIR = { ...S('aerials') }; // attack states are named after their move
  // specials are usable on the ground and in the air, so they live in both maps, as their own states (m.state, else the move's name,
  // e.g. Grok's extra neuralZap). Not Claw'd's held think or MCP tether (no startup / a reach: wired in by hand), nor flights (they steer themselves)
  FLY = {}; const own = {};
  for (const [k, m] of Object.entries(SP)) {
    const st = m.state || k;
    if (m.flight) FLY[st] = FLY[st + 'Charge'] = own[st] = m;
    else if (m.startup != null && m.reach == null) ATK[st] = AIR[st] = m;
  }
  MOVES = { ...ATK, ...AIR, ...own, ledgeAttack: L.ledgeAttack, pummel: GR.pummel, ...Object.fromEntries(THROWS.map(k => [k, GR[k]])) };
  if (!(NEUTRAL_B.state || 'neutralSpecial' in MOVES)) MOVES.neutralSpecial = NEUTRAL_B; // Claw'd's think: animated, no hitbox
}
loadMoves(MOVESET);
const think = () => { // resume from the last checkpoint reached · Duo's heart zap spends a heart (P.roll = hearts it had before)
  if (NEUTRAL_B.hearts) { P.roll = P.hearts; P.hearts = Math.max(0, P.hearts - 1); return setState('neutralSpecial'); }
  setState('neutralSpecial'); P.f = thinkFrom(P.think);
};
const RESPAWN_Y = 100; // respawn platform: where it stops (top of Claw'd's box)
// dodges and the ledge roll list intangible = [first, last) frames where nothing can hurt Claw'd
const intangible = () => { if (P.state === 'tunnel') return true; const it = (L[P.state] || D[P.state] || R[P.state] || MOVES[P.state])?.intangible; return !!it && P.f >= it[0] && P.f < it[1]; };
// collision box = Claw'd's body + legs (the arm nubs overhang it)
const P = { x: 610, y: 380, w: 60, h: 50, vx: 0, vy: 0, ground: false, on: null, jumps: 1, face: 1, drop: 0, inv: 0, state: 'air', f: 0, fastFall: false, dmg: 0, hitT: 0, ledge: 0, regrab: 0, think: 0 }; // think = neutral special effort tier reached (0 … 3), kept until KO
const GROUNDED = ['idle', 'walk', 'dash', 'run', 'skid', 'crouch', 'crouchWalk', 'crouchUp', 'squat', 'land', 'landLag', 'shield', 'shieldDrop', 'knockdown', 'getup', 'tech', 'hold', 'pummel', ...THROWS, ...DODGES, ...Object.keys(ATK).filter(k => !(k in AIR))];
const STOCKS = 3; let stocks = STOCKS;
const fx = []; // dust clouds left in the world: { x, y, dir, t }
const shots = []; // thrown sparks in flight: { x, y, vx, t, m }
let wreck = null; // a rocket-style up special's ship once the rider's off it: { x, y (its middle), vx, vy, t, m, boom = 0 … 1 once it's blowing up }
let cart = null; // a ride special's vehicle (Grok's Cybertruck), Steve minecart style: { x, y, w, h, vx, vy, face, t, ground, on, m = the move, dist = px driven, bag = target scooped into it, bagT, done }
let sub = null; // the down special's subagent: a half-size Claw'd box { x, y, w, h, vx, vy, face, t, ground, on, done = seconds since it reported back }
// every fighter: name, collision box [w, h], art = its draw function (bottom-centre x, y, pose, facing), set = its moveset: a group it
// doesn't have yet (attacks, specials, grabs, defense, ledge) is simply off for it · jumps = air jumps · flap = air jump speed ·
// glide = max fall speed holding jump. draw = standing, idling (t = seconds): dummies, portraits, the select and vs screens
const FIGHTER = {
  clawd: { name: "Claw'd", box: [60, 50], art: drawClawd, set: MOVESET },
  grok: { name: 'Grok Bot', box: [52, 56], art: drawGrok, set: GROK_MOVESET },
  wumpus: { name: 'Wumpus', box: [50, 64], art: drawWumpus, set: { movement: MOVESET.movement } },
  android: { name: 'Android', box: [50, 64], art: drawAndroid, set: { movement: MOVESET.movement } },
  duo: { name: 'Duo', box: [60, 61], art: drawDuo, set: DUO_MOVESET, jumps: 5, flap: 620, glide: 170 }, // flies like Kirby / Meta Knight
  snoo: { name: 'Snoo', box: [46, 76], art: drawSnoo, set: SNOO_MOVESET },
  lego: { name: 'Lego Man', box: [44, 72], art: drawLego, set: { movement: MOVESET.movement } },
  bag: { name: 'Training Bag', box: [44, 76], draw: (x, y, p) => drawSack(x, y, p.rot || 0) },
  random: { name: 'Random', box: [60, 60], draw: (x, y, p, f, t) => { ctx.save(); ctx.translate(x, y - 32); drawQuestion(48, t); ctx.restore(); } }, // a pick not rolled yet
};
const ROSTER = ['clawd', 'grok', 'wumpus', 'android', 'duo', 'snoo', 'lego']; // select screen order (LOGOS follows it)
ROSTER.forEach((id, k) => FIGHTER[id].draw = (x, y, p, f, t) => FIGHTER[id].art(x, y, { ...idleAt(t, k), ...p }, f)); // each a little out of step
fighter = FIGHTER.clawd;
// punching targets: the CPUs picked on the select screen as dummies, or the training bag if none. Each takes hits and knockback like a
// fighter (but never fights back) and drops back in where it started when it leaves the blast zone: CPUs STOCKS times, the bag forever
const TARGET_SPAWN = { vx: 0, vy: 0, dmg: 0, hitT: 0, rot: 0, hit: null, held: false, pinned: false, carted: false, sticker: null }; // held = in Claw'd's claws · pinned = on the end of the up special's cord
const SPAWN_X = [822, 435, 1000]; // centres they drop in at: the first where the bag always did, the others to either side
let targets = [], foes = [], cpus = [], rolled = []; // cpus = fighter ids picked as enemies ('random' until the vs screen rolls them into rolled) · foes = their targets, kept for the hud once out of lives
function spawnTarget(b) { Object.assign(b, TARGET_SPAWN, { x: b.home - b.w / 2, y: -120 - b.i * 70, ground: false, on: null }); }
function makeTargets() {
  targets = (rolled.length ? rolled : ['bag']).map((id, i) => { const b = { id, i, w: FIGHTER[id].box[0], h: FIGHTER[id].box[1], home: SPAWN_X[i], lives: id === 'bag' ? null : STOCKS }; spawnTarget(b); return b; });
  foes = targets.filter(b => b.lives != null);
}
const heldBag = () => targets.find(b => b.held);
makeTargets();
const KB = 10; // knockback units → px/s

const keys = {}; let jumpQ = false, downQ = false, dropQ = false, ffQ = false, dashQ = false, attackQ = false, heavyQ = false, specialQ = false, dodgeQ = false, grabQ = 0, techQ = 0, techLock = 0, sideQ = false, lastTap = { a: null, t: 0 }, lastDir = 0, pressT = {}, attackT = -1e9, tiltQ = false;
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', Space: 'jump',
                 ArrowDown: 'down', KeyS: 'down', KeyC: 'attack', KeyJ: 'attack', KeyX: 'heavy', KeyK: 'heavy', KeyV: 'special', KeyL: 'special', KeyZ: 'dodge', ShiftLeft: 'dodge', ShiftRight: 'dodge', KeyI: 'shield', KeyG: 'grab', KeyU: 'grab' }; // brawlhalla light / heavy: C X (arrows) · J K (WASD); special: V / L; dodge: Z / Shift; shield: I
// ---------- pause menu ----------
const MENU = ['resume', 'controls', 'restart', 'quit'], HOME_MENU = ['play', 'characters', 'controls'];
// controls screen: two columns of [heading, [[keys, what they do], …]]; descriptions wrap at the ' · ' breaks
const CONTROLS = [
  [['move', [['← → / A D', 'walk · double-tap to run'], ['Space', 'jump · tap for a short hop · again in the air'],
             ['↓ / S', 'crouch (+ ← → crawl) · tap: drop through a platform · hold in the air: fall through them · double-tap in the air: fast fall'],
             ['on a ledge', '↑ / toward: climb · ↓ / away: let go · Space: jump · C / X: attack · dodge: roll']]],
   ['defend', [['I', 'hold: shield · + ← →: roll · + ↓: spot dodge'], ['Shift / Z', 'dodge · + ← →: roll · in the air: dodge any way, once per jump'],
               ['tumbling', 'I / dodge just before landing: tech · + ← →: tech roll'], ['knocked down', 'any key: get up · ← →: roll away · C / X: getup attack']]]],
  [['attack', [['C / J', 'light: jab combo · + ← →: forward tilt · + ↑ ↓: tilts · running: dash attack · in the air: aerials'],
               ['X / K', 'heavy, hold to charge: forward smash · + ↑: terminal uppercut · + ↓: /compact · in the air: same aerials as light'],
               ['V / L', 'special · hold: think, up to ultrathink · + ← →: spark · + ↑: MCP tether · + ↓: subagent']]],
   ['grab', [['G / U', 'grab · running: dash grab'], ['holding', 'C / J: pummel · ← → ↑ ↓: throw']]],
   ['menu', [['Esc', 'pause']]]],
];
let paused = true, sel = 0, showControls = false, over = false, home = true, picking = false, vsT = null, menu = HOME_MENU; // boots to the home screen · picking = character select (after play) · vsT = when the vs screen started (after picking)
function setPaused(on) {
  paused = on; sel = 0; showControls = false; over = false; home = false; picking = false; vsT = null; menu = MENU;
  for (const k in keys) keys[k] = false; jumpQ = downQ = dropQ = ffQ = dashQ = attackQ = heavyQ = specialQ = dodgeQ = grabQ = techQ = techLock = false;
}
function gameOver(won) { setPaused(true); over = won ? 'win' : 'lose'; menu = ['restart', 'quit']; }
function goHome() { restart(); setPaused(true); home = true; menu = HOME_MENU; }
function restart() {
  stocks = STOCKS; fx.length = shots.length = 0; sub = cart = wreck = null; makeTargets();
  Object.assign(P, { x: 610, y: 380, vx: 0, vy: 0, ground: false, on: null, jumps: 1, face: 1, drop: 0, inv: 0, state: 'air', f: 0, fastFall: false, dmg: 0, hitT: 0, ledge: 0, regrab: 0, shield: 1, think: 0, hearts: NEUTRAL_B.hearts || 0, toastT: null });
}
function fight() { restart(); setPaused(false); } // leaves the vs screen
// character picked: the vs screen, then the fight. Random picks are rolled here, so the select screen never shows who they'll be
const rollPick = id => id === 'random' ? ROSTER[Math.floor(Math.random() * ROSTER.length)] : id;
function versus() { picking = false; vsT = performance.now(); fighter = FIGHTER[rollPick(p1)]; rolled = cpus.map(rollPick); M = fighter.set.movement; loadMoves(fighter.set); [P.w, P.h] = fighter.box; }
// B pressed: the special for the held direction. Claw'd's tether and think are wired in by hand; anything else is its own move, usable on
// the ground and in the air. oncePerAir moves can't be used again until it lands; a ride waits until the last one is gone; a zap
// (Grok's Neuralink) goes off instead while its chip is planted in someone
function special(dir) {
  specialQ = 0;
  const k = keys.up ? 'upSpecial' : keys.down ? 'downSpecial' : dir ? 'sideSpecial' : 'neutralSpecial', m = SP[k];
  if ((m.ride && cart) || (m.oncePerAir && !P.ground && P.usedB?.[k])) return;
  if (!P.ground) (P.usedB ||= {})[k] = true;
  if (k === 'upSpecial' && m.reach != null) return tetherUp(dir); // Claw'd's MCP tether
  if (dir) P.face = dir; P.held = true; P.chg = 0; P.roll = null;
  if (k === 'neutralSpecial' && (m.hearts || m.startup == null)) return think(); // Claw'd's held think / Duo's heart zap
  if (m.flight) { P.fastFall = false; P.aim = 0; return setState(m.state + 'Charge'); }
  setState(m.zap && targets.some(b => b.sticker?.chip) ? m.zap : m.state || k);
}
function choose(i) {
  if (menu[i] === 'controls') showControls = true;
  else if (menu[i] === 'quit') goHome();
  else if (menu[i] === 'characters') location.href = 'pages/moves.html'; // storyboard of every move
  else if (menu[i] === 'play') picking = true; // character select first
  else { if (menu[i] !== 'resume') restart(); setPaused(false); } // play / restart start fresh
}
addEventListener('keydown', e => {
  if (e.code === 'Escape') { e.preventDefault(); if (showControls) showControls = false; else if (vsT != null) { vsT = null; picking = true; } else if (picking) picking = false; else if (!over && !home) setPaused(!paused); return; }
  if (paused) {
    const a = KEYMAP[e.code], ok = e.code === 'Enter' || e.code === 'Space';
    if (showControls) { if (ok) showControls = false; }
    else if (vsT != null) { if (ok) fight(); else return; } // skip ahead
    else if (picking) { if (!pickKey(e.code, a)) return; }
    else if (a === 'up') sel = (sel + menu.length - 1) % menu.length;
    else if (a === 'down') sel = (sel + 1) % menu.length;
    else if (ok) choose(sel);
    else return;
    e.preventDefault(); return;
  }
  const a = KEYMAP[e.code]; if (!a) return;
  e.preventDefault();
  if (!keys[a]) {
    if (P.state === 'shieldBreak') P.f += 3; // mash out of the stun
    if (a === 'jump') jumpQ = BUFFER; // jump / attack / heavy stay queued for a few frames (see BUFFER)
    if (a === 'down') { downQ = true; if (lastTap.a === a && e.timeStamp - lastTap.t < 200) ffQ = true; pressT[a] = e.timeStamp; } // double-tap = fast fall, so ↓ can aim a down air freely
    if (a === 'attack') { attackQ = BUFFER; attackT = e.timeStamp; tiltQ = (keys.left || keys.right) && e.timeStamp - Math.max(pressT.left || 0, pressT.right || 0) < TILT_MS; }
    if (a === 'heavy') heavyQ = BUFFER;
    if (a === 'special') specialQ = BUFFER;
    if (a === 'dodge') dodgeQ = BUFFER;
    if (a === 'grab') grabQ = BUFFER;
    if ((a === 'dodge' || a === 'shield') && P.state === 'tumble' && !techLock) { techQ = R.tech.window; techLock = R.tech.lockout; } // teches a tumble that hits the ground within window frames
    if (a === 'left' || a === 'right') { // dash = a quick tap, then the same direction again right after (see keyup)
      lastDir = a === 'left' ? -1 : 1; sideQ = true; // fresh ← / → press (rolls out of shield)
      if (lastTap.a === a && e.timeStamp - lastTap.t < 200) dashQ = true;
      pressT[a] = e.timeStamp;
      if (e.timeStamp - attackT < TILT_MS) tiltQ = true; // direction landed just after light: still a tilt
    }
  }
  keys[a] = true;
});
addEventListener('keyup', e => {
  const a = KEYMAP[e.code]; if (!a) return;
  keys[a] = false;
  // only a short tap (< 150ms held) can start a dash / fast fall / platform drop (Smash's flick), so a held direction just walks / crouches
  if (a === 'down' && e.timeStamp - pressT.down < 400) dropQ = true; // a bit longer than the dash / fast fall tap
  if (a === 'left' || a === 'right' || a === 'down') lastTap = e.timeStamp - pressT[a] < 150 ? { a, t: e.timeStamp } : { a: null, t: 0 };
});
addEventListener('blur', () => { if (!over && !home) setPaused(true); });
// mouse: hover highlights, click picks (items drawn in drawPause)
const at = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
function menuAt(e) {
  const [x, y] = at(e), i = Math.floor((y - (menuY() - 36)) / 52);
  return paused && !showControls && !picking && vsT == null && Math.abs(x - W / 2) < 120 && i >= 0 && i < menu.length ? i : -1;
}
cv.addEventListener('mousemove', e => {
  const i = menuAt(e), p = picking && selectAt(...at(e)); if (i >= 0) sel = i;
  if (p?.tile != null) { focus = p.tile; onBand = false; } else if (p?.ready) onBand = true; // hover moves the keyboard focus too
  cv.style.cursor = i >= 0 || p ? 'pointer' : '';
});
cv.addEventListener('click', e => {
  if (paused && showControls) { showControls = false; return; }
  if (vsT != null) { fight(); return; }
  if (picking) { // character select hot spots (drawn in drawSelect)
    const p = selectAt(...at(e));
    if (p?.back) picking = false; else if (p?.tile != null) pickTile(p.tile); else if (p?.p1) p1 = null; else if (p?.slot) cpus.splice(p.slot - 1, 1); else if (p?.ready && p1) { versus(); cv.style.cursor = ''; }
    return;
  }
  const i = menuAt(e); if (i >= 0) { choose(i); if (!paused) cv.style.cursor = ''; }
});

const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const setState = s => { if (P.state !== s) { P.state = s; P.f = 0; } };
const dust = (dx, dir) => fx.push({ x: P.x + P.w / 2 + dx, y: P.y + P.h, dir, t: 0 });
const puff = () => { dust(-26, -1); dust(26, 1); };

function land(surface, wasGround) {
  if (!wasGround) {
    P.fastFall = false;
    if (P.state === 'shieldBreak') puff(); // still stunned through the landing
    else if (P.state === 'tumble' || (P.state === 'airDodge' && P.fromTumble && techQ)) { // tech (+ ← → tech roll), else slammed onto its back (dodging out of a tumble right before landing still techs)
      const d = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      if (techQ) { techQ = dodgeQ = 0; setState(d && has('defense') ? (d === P.face ? 'rollForward' : 'rollBack') : 'tech'); } else setState('knockdown');
      puff();
    }
    else if (P.state === 'hitstun') {} // flinches through the landing
    else if ((P.state in AIR && !AIR[P.state].keepOnLand) || ['airDodge', 'upSpecial', 'specialFall'].includes(P.state)) { P.lag = (AIR[P.state] || (P.state === 'airDodge' ? AD : US)).landingLag; setState('landLag'); puff(); } // landed mid-aerial / mid-dodge / helpless (keeps its slide)
    else if (P.state === 'neutralSpecial' || AIR[P.state]?.keepOnLand || (FLY[P.state] && P.state !== FLY[P.state].state)) {} // keeps thinking (charging) through the landing
    else if (FLY[P.state]) { const m = FLY[P.state]; blowWreck(P.x + P.w / 2, P.y + P.h - m.wreck.mid, m); P.lag = m.landingLag; setState('landLag'); } // flew into the floor
    else if (P.vy > 300) { setState('land'); puff(); } else setState('idle');
  }
  P.vy = 0; P.ground = true; P.on = surface; P.jumps = 2; P.airDodged = false; P.usedB = null;
}

// ledges: falling past a stage corner (not holding down) catches it. While on it, the ledge moves' x / air place Claw'd
// (measured from standing at the lip); P.ledge = which corner, -1 left / 1 right
function grabLedge() {
  if (!has('ledge') || P.regrab > 0 || keys.down || P.vy < 0 || !(['air', 'djump', 'upSpecial', 'specialFall'].includes(P.state) || (P.state === 'tumble' && P.f >= P.stun))) return;
  for (const side of [-1, 1]) {
    const lx = side < 0 ? stage.x : stage.x + stage.w, gap = side < 0 ? lx - (P.x + P.w) : P.x - lx;
    if (gap >= 0 && gap < 24 && P.y > stage.y - 40 && P.y < stage.y + 16) {
      Object.assign(P, { ledge: side, face: -side, fastFall: false, jumps: AIR_JUMPS(), airDodged: false }); // catching refreshes the double jump
      return setState('ledgeGrab');
    }
  }
}

  if (overlaps(b, stage)) {
    if (b.vy > 0) { b.y = stage.y - b.h; onLand(stage); }
    else { b.y = stage.y + stage.h; b.vy = 0; }
  }
  if (b.vy >= 0 && !(b.drop > 0)) for (const pl of plats) {
    if (b === P && keys.down && pl !== was) continue; // holding ↓: fall straight through (standing on one, the drop waits a beat instead)
    if (b.x + b.w > pl.x && b.x < pl.x + pl.w && prevBottom <= pl.y + 0.5 && b.y + b.h >= pl.y) {
      b.y = pl.y - b.h; onLand(pl);
    }
  }
}

// which frame of which animation to show for the current state
function clawdPose() {
  const f = P.f, atk = MOVES[P.state], fly = FLY[P.state];
  if (fly && P.state !== fly.state) return { ...fly.chargeAnim(f, P.chg / fly.chargeFrames), tilt: P.aim }; // charging a flight (c runs past 1 into the overheat), aimed
  if (atk) { const p = atk.anim(f, undefined, atk.chargeFrames ? P.chg / atk.chargeFrames : 0, P.roll); if (P.held && f === atk.chargeAt) p.x += P.chg % 4 < 2 ? 1.5 : -1.5; if (fly) p.tilt = P.fly.ang; return p; } // tremble while charging
  switch (P.state) {
    case 'idle': return M.idle.anim(f % 120, 120);
    case 'walk': return M.walk.anim(f % 40, 40);
    case 'dash': return M.dash.anim(Math.min(f, 16), 20);
    case 'run': return M.run.anim(f % 24, 24);
    case 'skid': return M.skid.anim(Math.min(Math.floor(P.sk), P.turn ? 25 : 13), 26); // a plain brake holds before the flip
    case 'crouch': return M.crouch.anim(f < 50 ? f : 5 + (f - 5) % 45, 60); // loop the held part
    case 'crouchWalk': return M.crouchWalk.anim(f % 32, 32);
    case 'crouchUp': return M.crouch.anim(Math.min(50 + f, 59), 60);
    case 'squat': return M.jumpSquat.anim(Math.min(6, f * 1.5), 14);
    case 'land': return M.land.anim(Math.min(3 + f, 17), 18);
    case 'landLag': return M.land.anim(Math.min(3 + f * 14 / P.lag, 17), 18); // the landing squash stretched over the lag
    case 'drop': return M.platformDrop.anim(Math.min(8 + f, 30), 40);
    case 'djump': return M.doubleJump.anim(Math.min(3 + f, 28), 36);
    case 'ledgeGrab': return L.ledgeGrab.anim(Math.min(f, 10));
    case 'ledgeHang': return L.ledgeHang.anim(f % 60, 60);
    case 'ledgeGetup': return L.ledgeGetup.anim(Math.min(f, 24));
    case 'ledgeJump': return L.ledgeJump.anim(f);
    case 'ledgeRoll': return L.ledgeRoll.anim(Math.min(f, 35));
    case 'shield': case 'shieldDrop': { // the terminal shrinks a little, cracks and fades as the shield wears down
      const p = D.shield.anim(P.state === 'shieldDrop' ? Math.min(50 + f, 59) : f < 4 ? f : 4 + (f - 4) % 46);
      if (p.shield) p.shield *= 0.75 + 0.25 * P.shield; p.wear = 1 - P.shield; return p; // (Duo's phone reads wear as its battery)
    }
    case 'shieldBreak': return { oopsMsg: P.oopsMsg, ...SB.anim(Math.min(f, SB.frames - 1)) }; // a fighter's own break message wins over Claw'd's random one
    case 'airDodge': { const p = D[P.dodgeAnim].anim(Math.min(f, AD.frames - 1)); p.rot = (p.rot || 0) + P.dodgeTilt * Math.min(1, f / 3, Math.max(0, (AD.frames - f) / 10)); return p; }
    case 'spotDodge': case 'rollForward': case 'rollBack': return D[P.state].anim(Math.min(f, D[P.state].frames - 1));
    case 'ledgeDrop': return L.ledgeDrop.anim(Math.min(f, 16));
    case 'upSpecial': { // the cord: out along its aim, or taut to the lip it's plugged into
      const T = P.teth, p = T.side || T.link != null ? { ...US.reelPose } : US.anim(Math.min(f, US.startup + US.active + US.endlag - 1));
      delete p.tether; delete p.air;
      const [hx, hy] = clawdHand(p, P.face), ax = P.x + P.w / 2 + hx, ay = P.y + P.h + hy, lx = T.side < 0 ? stage.x : stage.x + stage.w;
      if (T.side) Object.assign(p, { tether: [Math.hypot(lx - ax, stage.y - ay), Math.atan2(ay - stage.y, P.face * (lx - ax))], plugged: true });
      else if (T.link != null) { const px = T.bag.x + T.at[0], py = T.bag.y + T.at[1]; Object.assign(p, { tether: [Math.hypot(px - ax, py - ay), Math.atan2(ay - py, P.face * (px - ax))], plugged: true, flow: T.link / 24 }); }
      else if (T.len) p.tether = [T.len, T.ang];
      return p;
    }
    case 'hold': return GR.hold.anim(f % 60, 60);
    case 'hitstun': return R.hitstun.anim(Math.min(f, P.stun - 1), P.stun);
    case 'tumble': return R.tumble.anim(f % 40, 40);
    case 'knockdown': return R.knockdown.anim(f);
    case 'getup': case 'tech': return R[P.state].anim(Math.min(f, R[P.state].frames - 1));
    case 'respawn': return { ...M.idle.anim(f % 120, 120), pad: 1, padMark: R.respawn.mark, say: [R.respawn.say, Math.min(1, f / 10)] };
    case 'specialFall': return M.fall.anim(f % 40, 40); // helpless
    case 'tunnel': return { mound: f, moving: P.tun.steered ? !!(keys.left || keys.right) : true };
  }
  if (P.glide) return M.glide.anim(f % 48, 48);
  if (P.fastFall) return M.fastFall.anim(f % 24, 24);
  if (P.vy > 450) return M.fall.anim(f % 40, 40);
  // rising / floating: pick the jump-arc frame from vertical speed (stretched going up, tucked at the peak, reaching down)
  return M.fullHop.anim(7 + 48 * Math.min(1, Math.max(0, (P.vy + JUMP) / (JUMP + 450))), 64);
}

// ---------- render ----------
function surfaceBelow() {
  const cx = P.x + P.w / 2, feet = P.y + P.h;
  let best = null;
  for (const s of [stage, ...plats]) if (cx > s.x && cx < s.x + s.w && s.y >= feet - 1 && (best === null || s.y < best)) best = s.y;
  return best;
}

function render(t) {
  seed = Math.floor(t * 8) * 7919 + 1;
  ctx.drawImage(paper, 0, 0, W, H);
  ctx.lineCap = ctx.lineJoin = 'round';

  // faint pencil background
  ctx.strokeStyle = INK; ctx.globalAlpha = 0.18; ctx.lineWidth = 1.5;
  ellipse(1040, 150, 62, 62, 2);
  line(40, 470, 330, 440, 3, 1); line(330, 440, 620, 468, 3, 1); line(700, 460, 1000, 430, 3, 1); line(1000, 430, 1240, 462, 3, 1);
  ctx.globalAlpha = 1;

  // main stage
  ctx.fillStyle = '#e3d9c6'; path(stagePoly); ctx.fill();
  ctx.strokeStyle = INK;
  hatch([[240, 532], [1040, 532], [960, 610], [320, 610]]);
  ctx.lineWidth = 2.6; poly(stagePoly, 1.6);
  ctx.lineWidth = 1.4; line(250, 512, 1030, 512, 1.2, 1);

  // platforms
  for (const pl of plats) {
    const r = [[pl.x, pl.y], [pl.x + pl.w, pl.y], [pl.x + pl.w - 8, pl.y + 12], [pl.x + 8, pl.y + 12]];
    ctx.fillStyle = '#e3d9c6'; path(r); ctx.fill();
    hatch(r, 9, 0.35);
    ctx.lineWidth = 2.2; poly(r, 1.3);
  }

  // shadow
  const sy = surfaceBelow();
  if (sy !== null && P.state !== 'ko') {
    const dist = sy - (P.y + P.h), s = Math.max(0.25, 1 - dist / 400);
    ctx.globalAlpha = 0.35 * s;
    ctx.fillStyle = 'rgba(42,38,34,0.35)';
    ctx.beginPath(); ctx.ellipse(P.x + P.w / 2, sy, 44 * s, 5 * s, 0, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
  }

  drawTargets(t);
  if (sub) drawSub();
  if (wreck) wreck.m.wreck.draw(wreck.x, wreck.y, Math.atan2(wreck.vx, -wreck.vy), wreck.boom);
  if (cart && !cart.done) { const c = cart, air = c.ground ? 0 : Math.max(-0.25, Math.min(0.3, c.vy / 2500)); // noses down as it falls, a wheelie as it sets off
    fighter.art(c.x + c.w / 2, c.y + c.h, { car: 1, empty: P.state !== 'ride', squint: true, wheel: c.dist / 11, rot: air - 0.1 * Math.max(0, 1 - c.t / 0.15) }, c.face); }
  for (const sh of shots) { const k = Math.min(1, (sh.m.projectile.life - sh.t) / 0.1); sh.m.shotArt ? sh.m.shotArt(sh.x, sh.y, Math.min(k, sh.t / 0.1), Math.sign(sh.vx) || 1) : (sh.m.projectile.draw || drawSpark)(sh.x, sh.y, sh.r * k, sh.t * 14 * Math.sign(sh.vx), sh); } // shrinks away at max range

  // player (flickers after respawn)
  for (const d of fx) d.draw ? d.draw(d.x, d.y, d.t) : drawDust(d.x, d.y, d.t, d.dir);
  // x / air in poses are preview-only root motion; here physics moves Claw'd
  if (P.state === 'ko') { const p = R.ko.anim(R.ko.blastAt + P.f); p.blast[1] = P.ko[2]; drawClawd(P.ko[0], P.ko[1] + 2.5 * CV, p); }
  else if (P.state !== 'ride' && !(P.inv > 0 && Math.floor(t * 14) % 2)) { const pose = clawdPose(); ctx.globalAlpha = intangible() ? 0.5 : 1; drawFighter(P.x + P.w / 2, P.y + P.h, { ...pose, x: P.state in MOVES && !P.ledge ? pose.x : 0, ...powered(pose), ...toast() }, P.face); ctx.globalAlpha = 1; } // attacks lean and come back

  // hud
  drawHealth(t);
  if (paused) drawPause(t);
}

// the fighter in play; anyone but Claw'd is drawn inside his effects (speed lines, dizzy stars, respawn pad…), stretched to its height,
// minus his terminal shield and its shards: shield / wear / shatter are theirs to draw
const drawFighter = (cx, b, p, face) => drawClawd(cx, b, fighter.art === drawClawd ? p : { ...p, shield: 0, shatter: null, sy: (p.sy ?? 1) * fighter.box[1] / 50, body: () => fighter.art(cx, b, p, face) }, face);

// the up special's toasts ("connection refused" on a miss, "mcp connected" plugging into the bag): stay up TOAST frames whatever
// Claw'd does next (landing, getting up…). P.toastMsg = OOPS index or [headline, detail], P.toastOk = success style
const TOAST = 150;
const toast = () => P.toastT == null ? {} : { oops: Math.min(1, P.toastT / 6, (TOAST - P.toastT) / 12), oopsMsg: P.toastMsg, oopsOk: P.toastOk };

// effort tiers stay on Claw'd until KO: its aura, and 5% more size per tier (the neutral special's own pose already has both)
function powered(pose) {
  if (!P.think || P.state === 'neutralSpecial') return {};
  const g = 1 + 0.05 * P.think;
  return { aura: P.think, sx: (pose.sx ?? 1) * g, sy: (pose.sy ?? 1) * g };
}

// the subagent: the fighter at half size, popping in, running (or falling); once done just its toast, over where it poofed
function drawSub() {
  const S = DOWN_B.sub, bx = sub.x + sub.w / 2, by = sub.y + sub.h, fr = Math.floor(sub.t * 60);
  if (sub.done) return S.report && drawOops(bx, sub.y - 4, Math.min(1, sub.done / 0.1, (S.report - sub.done) / 0.2), DONE, true);
  const k = S.scale * Math.min(1, 0.4 + sub.t / 0.15), pose = !sub.ground ? M.fall.anim(fr % 40, 40) : S.speed ? M.run.anim(fr % 24, 24) : M.idle.anim(fr % 120, 120); // a plush that stays put just sits
  ctx.save(); ctx.translate(bx, by); ctx.scale(k, k); ctx.lineWidth = 2; fighter.art(0, 0, { ...pose, x: 0 }, sub.face); ctx.restore();
}

// the targets (dummies turned to face Claw'd), shaking when hit; only the training bag floats its damage % above it
function drawTargets(t) {
  for (const b of targets) {
    const sh = b.hitT * 14, bx = b.x + b.w / 2 + (Math.random() - 0.5) * sh, by = b.y + b.h;
    FIGHTER[b.id].draw(bx, by, { rot: b.rot }, Math.sign(P.x + P.w / 2 - bx) || -1, t);
    if (b.sticker) b.sticker.draw(bx, b.y + b.h * 0.45, b.rot, Math.min(1, (b.sticker.secs - b.sticker.t) / 0.3)); // fades at the end
    if (b.held && P.ratio) GR.hold.ratio.draw(bx, b.y - 44, P.ratio); // the ratio meter over whoever's held
    if (b.id !== 'bag') continue;
    ctx.font = '700 30px Caveat, cursive'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = INK;
    const pct = Math.round(b.dmg) + '%';
    ctx.strokeText(pct, bx, b.y - 12); ctx.fillStyle = dmgColor(b.dmg); ctx.fillText(pct, bx, b.y - 12);
  }
  ctx.textAlign = 'left';
}

// hud: Claw'd's badge top right, the CPUs' in a row to its left (the training bag keeps its % overhead instead)
function drawHealth(t) {
  const portrait = (F, face) => () => { const h = F.box[1], k = Math.min(1, 44 / h / 0.8); ctx.scale(k, k); F.draw(0, h / 2, {}, face, t); }; // fit the taller fighters in the circle
  badge(W - 120, P.dmg, P.hitT, portrait(fighter, 1), stocks);
  foes.forEach((b, i) => {
    ctx.globalAlpha = b.lives ? 1 : 0.35; // faded once out
    badge(W - 120 - (foes.length - i) * 150, b.dmg, b.hitT, portrait(FIGHTER[b.id], -1), b.lives);
  });
  ctx.globalAlpha = 1;
}

// a fighter's damage badge: its portrait in a circle coloured by damage, the % overlapping it, and stock pips if it has lives
function badge(x, dmg, hitT, portrait, lives) {
  const sh = hitT * 16, bx = x + (Math.random() - 0.5) * sh, by = 70 + (Math.random() - 0.5) * sh, R = 38; // shakes when hit
  ctx.fillStyle = dmgColor(dmg); ctx.beginPath(); ctx.arc(bx, by, R, 0, 6.28); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ellipse(bx, by, R, R, 1.2);
  ctx.save(); ctx.translate(bx, by); ctx.scale(0.8, 0.8); portrait(); ctx.restore(); // centred inside
  // damage %, overlapping the circle's bottom right, filled with the same colour
  ctx.font = '700 36px Caveat, cursive'; ctx.lineWidth = 3.5; ctx.textAlign = 'left'; ctx.strokeStyle = INK; // grows rightward, away from the circle
  const pct = Math.round(dmg) + '%', tx = bx + 12, ty = by + R + 6;
  ctx.strokeText(pct, tx, ty); ctx.fillStyle = dmgColor(dmg); ctx.fillText(pct, tx, ty);
  // stocks: a white pip per life left (lost ones just go), wrapping the circle's bottom-left quarter, starting at the bottom
  for (let i = 0; i < lives; i++) {
    const a = Math.PI / 2 - 0.04 + i * 0.38, px = bx + (R + 11) * Math.cos(a), py = by + (R + 11) * Math.sin(a);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px, py, 5, 0, 6.28); ctx.fill();
    ctx.lineWidth = 1.6; ellipse(px, py, 5, 5, 0.5);
  }
}

const menuY = () => home ? H / 2 + 160 : H / 2 + 10; // first menu row's baseline (home: below the title and lineup)

// home title: MASCOT over a tilted, ink-shadowed SMACKDOWN, then the fighters lined up on a ground line, Claw'd in the middle
function drawTitle(t) {
  ctx.save(); ctx.translate(W / 2, 215); ctx.rotate(-0.035);
  ctx.font = '700 44px Caveat, cursive'; ctx.letterSpacing = '14px'; ctx.fillStyle = INK; ctx.fillText('MASCOT', 7, -112);
  ctx.letterSpacing = '0px'; ctx.font = '700 132px Caveat, cursive';
  ctx.fillText('SMACKDOWN', 5, 5); ctx.fillStyle = CLAWD; ctx.fillText('SMACKDOWN', 0, 0);
  ctx.strokeStyle = INK; ctx.lineWidth = 3; line(-250, 22, 250, 18, 2, 2); // scribbled underline
  ctx.restore();
  const gy = H / 2 + 85;
  ctx.strokeStyle = INK; ctx.lineWidth = 2; line(W / 2 - 420, gy, W / 2 + 420, gy, 1.2, 1);
  [[-360, drawWumpus, 1], [-240, drawGrok, 1], [-120, drawLego, 1], [0, drawClawd, 1], [120, drawSnoo, -1], [240, drawAndroid, -1], [360, drawDuo, -1]].forEach(([x, draw, face], i) => {
    ctx.save(); ctx.translate(W / 2 + x, gy); ctx.scale(1.4, 1.4); draw(0, 0, idleAt(t, i), face); ctx.restore();
  });
}
// Claw'd's idle loop (every fighter can pose it) at time t, the k-th fighter out of step with the others so they don't breathe in unison
const idleAt = (t, k = 0) => M.idle.anim((Math.floor(t * 60) + 47 * k) % 120, 120);

function drawPause(t) {
  // home: clean paper with ink; pause / game over: the frozen game dimmed with light text
  if (home) ctx.drawImage(paper, 0, 0, W, H);
  else { ctx.fillStyle = `rgba(38,35,31,${showControls ? 0.94 : 0.8})`; ctx.fillRect(0, 0, W, H); } // near-solid behind the dense controls text
  if (picking) return drawSelect(t);
  if (vsT != null) return drawVersus((performance.now() - vsT) / 1000);
  ctx.fillStyle = ctx.strokeStyle = home ? INK : '#efe7d6'; ctx.textAlign = 'center';
  if (home && !showControls) {
    drawTitle(t);
  } else if (!showControls) { ctx.font = '700 84px Caveat, cursive'; ctx.fillText(over ? (over === 'win' ? 'victory!' : 'defeat') : 'paused', W / 2, H / 2 - 70); }
  if (showControls) drawControls(home ? INK : '#efe7d6');
  else {
    ctx.font = '600 40px Caveat, cursive';
    menu.forEach((m, i) => {
      ctx.globalAlpha = i === sel ? 1 : 0.5;
      ctx.fillText((i === sel ? '›  ' : '') + m + (i === sel ? '  ‹' : ''), W / 2, menuY() + i * 52);
    });
  }
  ctx.globalAlpha = 0.6; ctx.font = '600 22px Caveat, cursive'; // key hints (none on the home screen)
  if (showControls || !home) ctx.fillText(showControls ? 'Esc / Enter / click  back' : '↑ ↓ choose · Enter / Space / click select' + (over ? '' : ' · Esc resume'), W / 2, showControls ? H - 34 : H / 2 + 250);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

// vs screen: the pick on a peach panel sliding in from the left, the CPUs (or the training bag) on an ink one from the right,
// split on a slant, and a big VS popping in between. Plays VS_TIME seconds, then the fight starts (any key / click skips)
const VS_TIME = 2.4;
function drawVersus(s) {
  const ease = k => 1 - (1 - Math.min(1, Math.max(0, k))) ** 3, slide = ease(s / 0.35), cut = 70;
  const left = [[0, 0], [W / 2 + cut, 0], [W / 2 - cut, H], [0, H]], right = [[W / 2 + cut, 0], [W, 0], [W, H], [W / 2 - cut, H]];
  ctx.save(); ctx.translate(-(1 - slide) * W / 2, 0);
  ctx.fillStyle = '#f3cdb9'; path(left); ctx.fill(); ctx.strokeStyle = CLAWD; hatch(left, 16, 0.35);
  ctx.save(); ctx.translate(W * 0.27, H * 0.7); ctx.scale(3.4, 3.4); fighter.draw(0, 0, {}, 1, s); ctx.restore();
  ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.font = '700 76px Caveat, cursive'; ctx.fillText(fighter.name, W * 0.27, H * 0.88);
  ctx.restore();
  ctx.save(); ctx.translate((1 - slide) * W / 2, 0);
  ctx.fillStyle = INK; path(right); ctx.fill(); ctx.strokeStyle = PAPER; hatch(right, 16, 0.08);
  const glow = ctx.createRadialGradient(W * 0.73, H * 0.58, 10, W * 0.73, H * 0.58, 190); glow.addColorStop(0, 'rgba(242,237,226,0.22)'); glow.addColorStop(1, 'rgba(242,237,226,0)');
  ctx.fillStyle = glow; ctx.fillRect(W / 2, 0, W / 2, H); // a spotlight on them
  const foes = rolled.length ? rolled : ['bag'], n = foes.length, k = [3, 2.3, 1.8][n - 1], gap = [0, 200, 160][n - 1];
  foes.forEach((id, i) => {
    ctx.save(); ctx.translate(W * 0.73 + (i - (n - 1) / 2) * gap, H * 0.7); ctx.scale(k, k);
    FIGHTER[id].draw(0, 0, { rot: id === 'bag' ? Math.sin(s * 3) * 0.04 : 0 }, -1, s); ctx.restore();
  });
  ctx.fillStyle = PAPER; ctx.textAlign = 'center'; ctx.font = `700 ${n > 1 ? 44 : 76}px Caveat, cursive`; ctx.fillText(foes.map(id => FIGHTER[id].name).join(' · '), W * 0.73, H * 0.88);
  ctx.restore();
  ctx.strokeStyle = PAPER; ctx.lineWidth = 6; line(W / 2 + cut, -10, W / 2 - cut, H + 10, 3, 2); // the seam
  const pop = s < 0.3 ? 0 : 1 + 1.4 * (1 - ease((s - 0.3) / 0.18)); // VS slams in after the panels
  if (pop) {
    ctx.save(); ctx.translate(W / 2, H * 0.42); ctx.rotate(-0.08); ctx.scale(pop, pop);
    ctx.font = '700 190px Caveat, cursive'; ctx.textAlign = 'center';
    ctx.fillStyle = INK; ctx.fillText('VS', 8, 8); ctx.fillStyle = PAPER; ctx.fillText('VS', 0, 0);
    ctx.restore();
  }
  ctx.textAlign = 'left';
}

    ctx.translate(x + SLOT.w / 2, y + 240); ctx.scale(2.4, 2.4); FIGHTER[id].draw(0, 0, {}, i ? -1 : 1, t); ctx.restore();
    ctx.fillStyle = INK; path(rect(x, y + SLOT.h - 62, SLOT.w, 62)); ctx.fill(); // name plate
    ctx.fillStyle = PAPER; ctx.font = '700 40px Caveat, cursive'; ctx.fillText(FIGHTER[id].name, x + SLOT.w / 2, y + SLOT.h - 18);
    ctx.strokeStyle = i ? INK : CLAWD; ctx.lineWidth = i ? 2.4 : 3.4; poly(r, 1.2);
    tag(x + 10, y + 10, i ? (ghost ? 'no CPUs' : `CPU ${i}`) : 'P1', i ? '#6b7280' : CLAWD);
    if (!ghost) { ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.font = '700 34px Caveat, cursive'; ctx.fillText('×', x + SLOT.w - 20, y + 32); }
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}

// the controls screen: title, then each column's sections (heading + rule, then keys in orange beside their wrapped description)
function drawControls(fg) {
  ctx.font = '700 72px Caveat, cursive'; ctx.textAlign = 'center'; ctx.fillText('controls', W / 2, 92);
  CONTROLS.forEach((col, c) => {
    const x = c ? 690 : 110; let y = 158;
    for (const [head, rows] of col) {
      ctx.globalAlpha = 1; ctx.fillStyle = ctx.strokeStyle = fg; ctx.textAlign = 'left'; ctx.font = '700 30px Caveat, cursive';
      ctx.fillText(head, x, y); ctx.lineWidth = 1.4; ctx.globalAlpha = 0.35; line(x, y + 8, x + 480, y + 8, 1, 1); y += 38;
      for (const [k, d] of rows) {
        ctx.globalAlpha = 1; ctx.fillStyle = CLAWD; ctx.textAlign = 'right'; ctx.font = '700 24px Caveat, cursive'; ctx.fillText(k, x + 118, y);
        ctx.globalAlpha = 0.8; ctx.fillStyle = fg; ctx.textAlign = 'left'; ctx.font = '600 23px Caveat, cursive';
        for (const l of wrap(d, 350)) { ctx.fillText(l, x + 132, y); y += 26; }
        y += 8;
      }
      y += 14;
    }
  });
  ctx.globalAlpha = 1; ctx.fillStyle = ctx.strokeStyle = fg; ctx.textAlign = 'center';
}
// split text into lines no wider than w, breaking only between ' · ' parts
function wrap(text, w) {
  const out = [];
  for (const part of text.split(' · ')) {
    const t = out.length ? out[out.length - 1] + ' · ' + part : part;
    if (out.length && ctx.measureText(t).width <= w) out[out.length - 1] = t; else out.push(part);
  }
  return out;
}

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  if (paused) acc = 0;
  if (vsT != null && now - vsT > VS_TIME * 1000) fight();
  while (!paused && acc >= STEP) { update(STEP); acc -= STEP; } // game over can pause mid-frame
  cv.style.translate = hitstop > 0 ? `${(Math.random() - 0.5) * 6}px ${(Math.random() - 0.5) * 6}px` : ''; // shake during hit freeze
  render(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
