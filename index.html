<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ibrawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #26231f; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="sketch.js"></script>
<script src="clawd.js"></script>
<script src="moveset.js"></script>
<script>
const W = 1280, H = 720, STEP = 1 / 60;
const cv = document.getElementById('c'); ctx = cv.getContext('2d');
const dpr = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * dpr; cv.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
const paper = makePaper(W, H, dpr);

// ---------- arena ----------
const stage = { x: 240, y: 500, w: 800, h: 110 }; // solid collision box
const stagePoly = [[240, 500], [1040, 500], [1040, 530], [960, 610], [320, 610], [240, 530]];
const plats = [{ x: 330, y: 375, w: 210 }, { x: 740, y: 375, w: 210 }, { x: 535, y: 255, w: 210 }]; // pass-through
const SPIKES = { x: 955, y: 484, w: 75, h: 16, dmg: 12, kb: { base: 60, growth: 60, angle: 70 } }; // hazard on the stage's right side
const BLAST = { l: -220, r: W + 220, t: -360, b: H + 200 };

// ---------- player ----------
const G = 2300, RUN = 440, DASH = 600, WALK = 190, CRAWL = 110, JUMP = 930, HOP = 640, AIRJUMP = 820;
const TURN_SPEED = 1.4; // turnaround plays this much faster than a plain brake
// attack feel: presses are remembered for BUFFER frames; the last CANCEL share of a move's recovery can be cut short by any input;
// a move that connects recovers in HIT_REC of the time (and can jump out right away); hits freeze both sides for a few frames
const BUFFER = 8, CANCEL = 0.4, HIT_REC = 0.6, ATK_FRICTION = 1400;
const TILT_MS = 150; // forward tilt needs ← / → pressed within this long of light; a direction you're just holding (walking) still jabs
const ATTACK_FROM = ['idle', 'walk', 'dash', 'run', 'skid', 'crouch', 'crouchWalk', 'crouchUp', 'land', 'shield'];
// shield: holding it wears it down, letting go lets it grow back; blocking a hit costs a chunk. Emptied = it breaks (stun), and comes back at SHIELD_MIN
const SHIELD_DRAIN = 1 / 240, SHIELD_REGEN = 1 / 360, SHIELD_HIT = 0.3, SHIELD_MIN = 0.3;
let hitstop = 0;
const M = MOVESET.movement, L = MOVESET.ledge, JABS = ['jab1', 'jab2', 'jab3'];
const SIDE_B = MOVESET.specials.sideSpecial; // usable on the ground and in the air, so it lives in both maps
const ATK = { ...MOVESET.groundAttacks, ...MOVESET.smashAttacks, sideSpecial: SIDE_B }, AIR = { ...MOVESET.aerials, sideSpecial: SIDE_B }; // attack states are named after their move
const NEUTRAL_B = MOVESET.specials.neutralSpecial; // held charge, no hitbox yet
const MOVES = { ...ATK, ...AIR, ledgeAttack: L.ledgeAttack, neutralSpecial: NEUTRAL_B };
const think = () => { setState('neutralSpecial'); P.f = thinkFrom(P.think); }; // resume from the last checkpoint reached
const D = MOVESET.defense, DODGES = ['spotDodge', 'rollForward', 'rollBack'], AD = D.airDodge, SB = D.shieldBreak;
// dodges and the ledge roll list intangible = [first, last) frames where nothing can hurt Claw'd
const intangible = () => { const it = (L[P.state] || D[P.state])?.intangible; return !!it && P.f >= it[0] && P.f < it[1]; };
// collision box = Claw'd's body + legs (the arm nubs overhang it)
const P = { x: 610, y: 380, w: 60, h: 50, vx: 0, vy: 0, ground: false, on: null, jumps: 1, face: 1, drop: 0, inv: 0, state: 'air', f: 0, fastFall: false, dmg: 0, hitT: 0, ledge: 0, regrab: 0, think: 0 }; // think = neutral special effort tier reached (0 … 3), kept until KO
const GROUNDED = ['idle', 'walk', 'dash', 'run', 'skid', 'crouch', 'crouchWalk', 'crouchUp', 'squat', 'land', 'landLag', 'shield', 'shieldDrop', ...DODGES, ...Object.keys(ATK).filter(k => !(k in AIR))];
const STOCKS = 3; let stocks = STOCKS;
const fx = []; // dust clouds left in the world: { x, y, dir, t }
const shots = []; // thrown sparks in flight: { x, y, vx, t, m }
// punching bag: a sack that takes hits and knockback like a fighter; respawns when it leaves the blast zone
const BAG_SPAWN = { x: 800, y: -120, vx: 0, vy: 0, dmg: 0, hitT: 0, rot: 0, hit: null };
const bag = { w: 44, h: 76, ground: false, on: null, ...BAG_SPAWN };
const KB = 10; // knockback units → px/s

const keys = {}; let jumpQ = false, downQ = false, ffQ = false, dashQ = false, attackQ = false, heavyQ = false, specialQ = false, dodgeQ = false, sideQ = false, lastTap = { a: null, t: 0 }, lastDir = 0, pressT = {}, attackT = -1e9, tiltQ = false;
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', Space: 'jump',
                 ArrowDown: 'down', KeyS: 'down', KeyC: 'attack', KeyJ: 'attack', KeyX: 'heavy', KeyK: 'heavy', KeyV: 'special', KeyL: 'special', KeyZ: 'dodge', ShiftLeft: 'dodge', ShiftRight: 'dodge', KeyI: 'shield' }; // brawlhalla light / heavy: C X (arrows) · J K (WASD); special: V / L; dodge: Z / Shift; shield: I
// ---------- pause menu ----------
const MENU = ['resume', 'controls', 'restart', 'quit'], HOME_MENU = ['play', 'characters', 'controls'];
const CONTROLS = [['← → / A D', 'walk · double-tap to run'], ['Space', 'jump · tap = short hop · x2 · ledge: ↑ / toward climb, ↓ / away let go'],
                  ['↓ / S', 'crouch (+ ← → crawl) · drop through · double-tap in the air: fast fall'],
                  ['C / J', 'light · jab combo · tap ← → with it = forward tilt · ↑ / ↓ tilts · running = dash attack · in the air: aerials (+ ← → ↑ ↓)'], ['X / K', 'heavy · hold to charge'], ['V / L', 'special · + ← → throw a spark · hold alone to think up to ultrathink: more damage + speed per tier, until KO (ground or air)'], ['I', 'hold: shield (terminal) · + ← → roll · + ↓ spot dodge'], ['Shift / Z', 'dodge: spot dodge · + ← → roll · in the air: dodge any way (once per jump) · on a ledge: roll onto the stage'], ['Esc', 'pause']];
let paused = true, sel = 0, showControls = false, over = false, home = true, menu = HOME_MENU; // boots to the home screen
function setPaused(on) {
  paused = on; sel = 0; showControls = false; over = false; home = false; menu = MENU;
  for (const k in keys) keys[k] = false; jumpQ = downQ = ffQ = dashQ = attackQ = heavyQ = specialQ = dodgeQ = false;
}
function gameOver() { setPaused(true); over = true; menu = ['restart', 'quit']; }
function goHome() { restart(); setPaused(true); home = true; menu = HOME_MENU; }
function restart() {
  stocks = STOCKS; fx.length = shots.length = 0; Object.assign(bag, BAG_SPAWN);
  Object.assign(P, { x: 610, y: 380, vx: 0, vy: 0, ground: false, on: null, jumps: 1, face: 1, drop: 0, inv: 0, state: 'air', f: 0, fastFall: false, dmg: 0, hitT: 0, ledge: 0, regrab: 0, shield: 1, think: 0 });
}
function choose(i) {
  if (menu[i] === 'controls') showControls = true;
  else if (menu[i] === 'quit') goHome();
  else if (menu[i] === 'characters') location.href = 'moves.html'; // storyboard of every move
  else { if (menu[i] !== 'resume') restart(); setPaused(false); } // play / restart start fresh
}
addEventListener('keydown', e => {
  if (e.code === 'Escape') { e.preventDefault(); if (showControls) showControls = false; else if (!over && !home) setPaused(!paused); return; }
  if (paused) {
    const a = KEYMAP[e.code], ok = e.code === 'Enter' || e.code === 'Space';
    if (showControls) { if (ok) showControls = false; }
    else if (a === 'up') sel = (sel + menu.length - 1) % menu.length;
    else if (a === 'down') sel = (sel + 1) % menu.length;
    else if (ok) choose(sel);
    else return;
    e.preventDefault(); return;
  }
  const a = KEYMAP[e.code]; if (!a) return;
  e.preventDefault();
  if (!keys[a]) {
    if (P.state === 'shieldBreak') P.f += 3; // mash out of the stun
    if (a === 'jump') jumpQ = BUFFER; // jump / attack / heavy stay queued for a few frames (see BUFFER)
    if (a === 'down') { downQ = true; if (lastTap.a === a && e.timeStamp - lastTap.t < 200) ffQ = true; pressT[a] = e.timeStamp; } // double-tap = fast fall, so ↓ can aim a down air freely
    if (a === 'attack') { attackQ = BUFFER; attackT = e.timeStamp; tiltQ = (keys.left || keys.right) && e.timeStamp - Math.max(pressT.left || 0, pressT.right || 0) < TILT_MS; }
    if (a === 'heavy') heavyQ = BUFFER;
    if (a === 'special') specialQ = BUFFER;
    if (a === 'dodge') dodgeQ = BUFFER;
    if (a === 'left' || a === 'right') { // dash = a quick tap, then the same direction again right after (see keyup)
      lastDir = a === 'left' ? -1 : 1; sideQ = true; // fresh ← / → press (rolls out of shield)
      if (lastTap.a === a && e.timeStamp - lastTap.t < 200) dashQ = true;
      pressT[a] = e.timeStamp;
      if (e.timeStamp - attackT < TILT_MS) tiltQ = true; // direction landed just after light: still a tilt
    }
  }
  keys[a] = true;
});
addEventListener('keyup', e => {
  const a = KEYMAP[e.code]; if (!a) return;
  keys[a] = false;
  // only a short tap (< 150ms held) can start a dash / fast fall, so letting go of a held direction and pressing it again just walks
  if (a === 'left' || a === 'right' || a === 'down') lastTap = e.timeStamp - pressT[a] < 150 ? { a, t: e.timeStamp } : { a: null, t: 0 };
});
addEventListener('blur', () => { if (!over && !home) setPaused(true); });
// mouse: hover highlights, click picks (items drawn in drawPause)
function menuAt(e) {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  const i = Math.floor((y - (H / 2 - 26)) / 52);
  return paused && !showControls && Math.abs(x - W / 2) < 120 && i >= 0 && i < menu.length ? i : -1;
}
cv.addEventListener('mousemove', e => { const i = menuAt(e); if (i >= 0) sel = i; cv.style.cursor = i >= 0 ? 'pointer' : ''; });
cv.addEventListener('click', e => {
  if (paused && showControls) { showControls = false; return; }
  const i = menuAt(e); if (i >= 0) { choose(i); if (!paused) cv.style.cursor = ''; }
});

const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const setState = s => { if (P.state !== s) { P.state = s; P.f = 0; } };
const dust = (dx, dir) => fx.push({ x: P.x + P.w / 2 + dx, y: P.y + P.h, dir, t: 0 });
const puff = () => { dust(-26, -1); dust(26, 1); };

function land(surface, wasGround) {
  if (!wasGround) {
    P.fastFall = false;
    if (P.state === 'shieldBreak') puff(); // still stunned through the landing
    else if (P.state in AIR || P.state === 'airDodge') { P.lag = (AIR[P.state] || AD).landingLag; setState('landLag'); puff(); } // landed mid-aerial / mid-dodge (keeps its slide)
    else if (P.state === 'neutralSpecial') {} // keeps thinking through the landing
    else if (P.vy > 300) { setState('land'); puff(); } else setState('idle');
  }
  P.vy = 0; P.ground = true; P.on = surface; P.jumps = 2; P.airDodged = false;
}

// ledges: falling past a stage corner (not holding down) catches it. While on it, the ledge moves' x / air place Claw'd
// (measured from standing at the lip); P.ledge = which corner, -1 left / 1 right
function grabLedge() {
  if (P.regrab > 0 || keys.down || P.vy < 0 || !['air', 'djump'].includes(P.state)) return;
  for (const side of [-1, 1]) {
    const lx = side < 0 ? stage.x : stage.x + stage.w, gap = side < 0 ? lx - (P.x + P.w) : P.x - lx;
    if (gap >= 0 && gap < 24 && P.y > stage.y - 40 && P.y < stage.y + 16) {
      Object.assign(P, { ledge: side, face: -side, fastFall: false, jumps: 1, airDodged: false }); // catching refreshes the double jump
      return setState('ledgeGrab');
    }
  }
}
function ledgeInput(dir) {
  const s = P.state;
  if (s === 'ledgeGrab' && P.f >= L.ledgeGrab.frames) setState('ledgeHang');
  else if (s === 'ledgeHang') {
    if (jumpQ) { jumpQ = 0; setState('ledgeJump'); }
    else if (dodgeQ) { dodgeQ = 0; setState('ledgeRoll'); }
    else if (attackQ || heavyQ) { attackQ = heavyQ = 0; setState('ledgeAttack'); }
    else if (keys.up || dir === P.face) setState('ledgeGetup');
    else if (keys.down || dir === -P.face) { P.ledge = 0; P.regrab = 0.4; setState('ledgeDrop'); }
  }
  else if (s === 'ledgeGetup' && P.f >= L.ledgeGetup.frames) { P.ledge = 0; P.ground = true; P.on = stage; P.jumps = 2; setState('idle'); }
  else if (s === 'ledgeJump' && P.f >= L.ledgeJump.launchAt) { P.ledge = 0; P.regrab = 0.4; P.vy = -JUMP; P.jumps = 1; setState('air'); }
  else if (s === 'ledgeRoll' && P.f >= L.ledgeRoll.frames) { P.ledge = 0; P.ground = true; P.on = stage; P.jumps = 2; setState('idle'); }
  else if (s === 'ledgeAttack' && P.f >= L.ledgeAttack.startup + L.ledgeAttack.active + L.ledgeAttack.endlag) { P.ledge = 0; P.ground = true; P.on = stage; P.jumps = 2; setState('idle'); }
  else if ((s === 'ledgeGetup' && P.f === 19) || (s === 'ledgeAttack' && P.f === 15) || (s === 'ledgeRoll' && P.f === 26)) puff(); // feet hit the stage
}
function ledgePlace() {
  const p = clawdPose(), lx = P.ledge < 0 ? stage.x : stage.x + stage.w;
  P.x = lx + P.face * (P.w / 2 + (p.x || 0)) - P.w / 2; P.y = stage.y + (p.air || 0) - P.h; P.vx = P.vy = 0;
}

// the shield ran out: the terminal shatters, Claw'd pops up and is left dizzy for SB.frames (each key press shakes off 3 frames)
function breakShield() {
  P.shield = 0; P.vy = -SB.pop; P.ground = false; P.on = null; hitstop = 10; setState('shieldBreak');
  P.oopsMsg = Math.floor(Math.random() * OOPS.length); // which error toast pops up over its head
}

function respawn() {
  if (--stocks <= 0) return gameOver();
  Object.assign(P, { x: W / 2 - P.w / 2, y: -80, vx: 0, vy: 0, jumps: 1, inv: 1.5, fastFall: false, dmg: 0, hitT: 0, ledge: 0, airDodged: false, shield: 1, think: 0 });
  setState('air');
}

// brawlhalla-style damage: no number, the portrait goes white → yellow → orange → red → dark red
function hurt(n) { P.dmg += n; P.hitT = 0.3; }
const DMG = [[0, [242, 237, 226]], [60, [242, 207, 74]], [120, [236, 139, 54]], [180, [217, 68, 46]], [250, [110, 26, 20]]];
function dmgColor(d) {
  let i = 0; while (i < DMG.length - 2 && d > DMG[i + 1][0]) i++;
  const [d0, a] = DMG[i], [d1, b] = DMG[i + 1], k = Math.min(1, (d - d0) / (d1 - d0));
  return `rgb(${a.map((v, j) => Math.round(v + (b[j] - v) * k))})`;
}

function update(dt) {
  if (hitstop > 0) { hitstop--; return; } // impact freeze: nothing moves, but presses stay buffered
  P.f++;
  const dir = keys.left && keys.right ? lastDir : (keys.right ? 1 : 0) - (keys.left ? 1 : 0); // both held: newest wins
  let s = P.state;

  if (P.ground && s in ATK) { // locked in until the recovery can be cancelled
    const m = ATK[s], i = JABS.indexOf(s), done = m.startup + m.active;
    const rec = m.endlag * (P.landed ? HIT_REC : 1), end = done + rec;
    if (s === 'forwardSmash') { // holding heavy freezes the wind-up at chargeAt, up to chargeFrames
      P.held = P.held && keys.heavy;
      if (P.held && P.f > m.chargeAt && P.chg < m.chargeFrames) { P.f = m.chargeAt; P.chg++; }
    }
    if (attackQ && i >= 0 && i < 2 && !tiltQ && !keys.up && !keys.down) { P.nextJab = true; attackQ = 0; } // light during a jab queues the next one (a held direction is fine); a fresh tilt input waits for the cancel window instead
    if (P.nextJab && P.f >= done) { P.nextJab = false; setState(JABS[i + 1]); }
    else if (P.f >= end || (P.f >= end - rec * CANCEL && (dir || jumpQ || attackQ || heavyQ || specialQ || dodgeQ || keys.down)) || (P.landed && P.f >= done && jumpQ)) {
      if (keys.down && P.on === stage) { P.state = 'crouch'; P.f = 5; } // still holding down: stay crouched
      else setState(s === 'downTilt' ? 'crouchUp' : 'idle');
      s = P.state; // free: fall through and act on this frame's input
    }
  }

  if (P.ledge) ledgeInput(dir);
  else if (P.ground) {
    if (s in ATK) {}
    else if (s === 'shieldBreak') { if (P.f >= SB.frames) { P.shield = Math.max(P.shield, SHIELD_MIN); setState('idle'); } } // dizzy: no control
    else if (s === 'landLag') { if (P.f >= P.lag) setState('idle'); }
    else if (DODGES.includes(s)) { if (P.f >= D[s].frames) setState('idle'); }
    else if (s === 'neutralSpecial') { if (!keys.special) setState('idle'); } // charges while held
    else if (s === 'shield' && P.shield <= 0) breakShield();
    else if (s === 'shield' && !(attackQ || heavyQ || specialQ || jumpQ)) { // holding up the terminal; attacks / jump come straight out of it below
      if (downQ || (dodgeQ && !dir)) { dodgeQ = 0; setState('spotDodge'); }
      else if ((sideQ || dodgeQ) && dir) { dodgeQ = 0; setState(dir === P.face ? 'rollForward' : 'rollBack'); }
      else if (!keys.shield) setState('shieldDrop');
    }
    else if (s === 'shieldDrop' && P.f < 7) {} // lowering it
    else if (dodgeQ && ATTACK_FROM.includes(s) && s !== 'shield' && !(s === 'land' && P.f < 4)) { // dodge: + ← → = roll that way, else spot dodge
      dodgeQ = 0; setState(dir && !keys.down ? (dir === P.face ? 'rollForward' : 'rollBack') : 'spotDodge');
    }
    else if (heavyQ && ATTACK_FROM.includes(s) && !(s === 'land' && P.f < 4)) { if (dir) P.face = dir; heavyQ = 0; P.held = true; P.chg = 0; setState('forwardSmash'); }
    else if (specialQ && ATTACK_FROM.includes(s) && !(s === 'land' && P.f < 4)) { if (dir) P.face = dir; specialQ = 0; dir ? setState('sideSpecial') : think(); }
    else if (attackQ && ATTACK_FROM.includes(s) && !(s === 'land' && P.f < 4)) {
      // light: up / down pick the tilt, moving fast = dash attack, a direction = forward tilt, else jab
      const atk = keys.up ? 'upTilt' : keys.down ? 'downTilt' : s === 'dash' || s === 'run' ? 'dashAttack' : dir && tiltQ ? 'forwardTilt' : 'jab1';
      if (dir && atk !== 'dashAttack') P.face = dir;
      attackQ = 0; P.nextJab = false; setState(atk);
    }
    else if (keys.shield && ATTACK_FROM.includes(s) && s !== 'shield' && !(s === 'land' && P.f < 4)) setState('shield'); // held I: raise it (also right after a roll, landing…)
    else if (jumpQ && s !== 'squat') { jumpQ = 0; setState('squat'); }
    else if (downQ && P.on !== stage) { P.drop = 0.2; P.ground = false; P.y += 2; P.jumps = 1; setState('drop'); } // through the platform
    else if (s === 'squat') { // jump decided at the end of the squat: still holding = full hop, tapped = short hop
      if (P.f >= 4) { P.vy = keys.jump ? -JUMP : -HOP; P.ground = false; P.jumps = 1; setState('air'); puff(); }
    }
    else if (s === 'skid') { // braking slide; pressing the other way at any point turns it into a turnaround
      if (dir === -P.face) P.turn = true;
      P.sk += P.turn ? TURN_SPEED : 1; // skid animation progress
      if (P.turn && P.sk >= 26) { P.face = -P.face; setState(dir === P.face ? 'run' : 'idle'); } // still holding the new way = keep running
      else if (!P.turn && dir === P.face) setState('run');
      else if (!P.turn && P.sk >= 16) setState('idle');
    }
    else if (keys.down && P.on === stage) { // crouch; add a direction to crawl once fully down
      if (dir && (s === 'crouchWalk' || (s === 'crouch' && P.f >= 5))) { P.face = dir; setState('crouchWalk'); }
      else if (!dir && s === 'crouchWalk') { P.state = 'crouch'; P.f = 5; } // back to the held crouch, skipping the squat-down
      else if (s !== 'crouch') setState('crouch');
    }
    else if (s === 'crouch' || s === 'crouchWalk') setState('crouchUp');
    else if ((s === 'land' && (P.f < 4 || (!dir && P.f < 15))) || (s === 'crouchUp' && !dir && P.f < 10)) {} // let these play out
    else if (s === 'run' && dir !== P.face) { P.turn = dir === -P.face; P.sk = 0; setState('skid'); dust(P.face * 34, P.face); } // let go or reversed
    else if (!dir) setState('idle');
    else if (s === 'run' || (s === 'dash' && P.f >= 16)) setState('run');
    else if (dashQ || (s === 'dash' && dir !== P.face)) { P.face = dir; P.state = 'dash'; P.f = 0; } // turning mid-dash restarts it
    else if (s !== 'dash') { P.face = dir; setState('walk'); }
  } else {
    if (GROUNDED.includes(s)) { P.jumps = Math.min(P.jumps, 1); setState('air'); s = 'air'; } // walked off an edge
    if (s in AIR) { // aerial: drift freely the whole time; free once it ends, or early like ground attacks
      const m = AIR[s], done = m.startup + m.active, rec = m.endlag * (P.landed ? HIT_REC : 1), end = done + rec;
      if (P.f >= end || (P.f >= end - rec * CANCEL && (jumpQ || attackQ)) || (P.landed && P.f >= done && jumpQ)) { setState('air'); s = 'air'; }
    }
    if (s === 'neutralSpecial' && !keys.special) { setState('air'); s = 'air'; } // let go: stop charging
    const free = ['air', 'djump', 'drop', 'ledgeDrop'].includes(s);
    if (attackQ && free) { // aerial picked by the held direction (back = away from facing)
      attackQ = 0; setState(keys.up ? 'upAir' : keys.down ? 'downAir' : dir === P.face ? 'forwardAir' : dir ? 'backAir' : 'neutralAir');
    }
    else if (specialQ && free) { if (dir) P.face = dir; specialQ = 0; dir ? setState('sideSpecial') : think(); }
    else if (dodgeQ && free && !P.airDodged) { // air dodge: aim with the arrows (diagonals too), no direction = stall
      const dx = dir, dy = keys.up ? -1 : keys.down ? 1 : 0, n = Math.hypot(dx, dy) || 1;
      dodgeQ = 0; P.airDodged = true; P.fastFall = false; P.dodgeV = [dx / n * AD.speed, dy / n * AD.speed]; setState('airDodge');
      P.dodgeAnim = !dx ? 'airDodge' : dx === P.face ? 'airDodgeForward' : 'airDodgeBack'; P.dodgeTilt = dx ? dy * 0.35 * dx * P.face : 0; // diagonals tip toward where it's going
    }
    else if (s === 'airDodge') { if (P.f >= AD.frames) setState('air'); }
    else if (jumpQ && P.jumps > 0 && !(s in AIR) && s !== 'shieldBreak') { jumpQ = 0; P.vy = -AIRJUMP; P.jumps = 0; P.fastFall = false; setState('djump'); }
    if (ffQ && P.vy > -150 && P.state !== 'airDodge' && P.state !== 'shieldBreak') P.fastFall = true; // double-tap down near the peak or after
    if ((P.state === 'djump' && P.f >= 25) || (P.state === 'drop' && P.f >= 20) || (P.state === 'ledgeDrop' && P.f >= 16)) setState('air');
  }
  downQ = ffQ = dashQ = sideQ = false;
  if (P.state === 'neutralSpecial') P.think = Math.max(P.think, NEUTRAL_B.anim(P.f).aura || 0); // checkpoint locked in
  jumpQ = Math.max(0, jumpQ - 1); attackQ = Math.max(0, attackQ - 1); heavyQ = Math.max(0, heavyQ - 1); specialQ = Math.max(0, specialQ - 1); dodgeQ = Math.max(0, dodgeQ - 1);

  // horizontal: ground speed comes from the state, air speed from the stick
  let target = 0, accel; const pw = THINK_POWER[P.think]; // effort tier speeds up walking, running and air drift
  if (P.ground) {
    if (['walk', 'dash', 'run', 'crouchWalk'].includes(P.state)) target = P.face * pw * { walk: WALK, dash: DASH, run: RUN, crouchWalk: CRAWL }[P.state];
    const atk = ATK[P.state], dg = DODGES.includes(P.state) && D[P.state].anim;
    if (dg) target = P.vx = P.face * ((dg(P.f + 1).x || 0) - (dg(P.f).x || 0)) / dt; // rolls move exactly as their animation's x
    if (atk?.step && P.f === atk.startup) P.vx = P.face * Math.max(P.face * P.vx, atk.step); // the move's lunge
    accel = target ? 4200 : P.state === 'skid' ? (P.turn ? 1800 * TURN_SPEED : 1800) : P.state === 'dashAttack' ? 800 : atk || P.state === 'landLag' ? ATK_FRICTION : 3600; // attacks keep momentum
  } else { target = P.state === 'shieldBreak' ? 0 : dir * RUN * pw; accel = dir && target ? 2300 : 700; }
  const dv = target - P.vx;
  P.vx += Math.sign(dv) * Math.min(Math.abs(dv), accel * dt);
  if ((P.state === 'run' && P.f % 12 === 0) || (P.state === 'dash' && P.f === 5) || (P.state in ATK && ATK[P.state].anim(P.f).dust === 0)) dust(-P.face * 34, -P.face); // steps / dash launch
  if (P.state.startsWith('roll') && P.f === 4) { const d = P.state === 'rollForward' ? -P.face : P.face; dust(d * 34, d); } // kicked up opposite the roll

  P.vy += G * dt;
  P.vy = Math.min(P.vy, P.fastFall ? 1500 : 950);
  if (P.fastFall) P.vy = Math.max(P.vy, 1100);
  if (P.state === 'airDodge' && P.f <= AD.burst) { // the dodge burst ignores gravity and steering, then eases off
    const k = P.f === AD.burst ? 0.4 : 1;
    P.vx = P.dodgeV[0] * k; P.vy = P.dodgeV[1] * k;
  }

  const wasGround = P.ground;
  P.drop = Math.max(0, P.drop - dt);
  P.inv = Math.max(0, P.inv - dt);
  P.hitT = Math.max(0, P.hitT - dt);
  P.regrab = Math.max(0, P.regrab - dt);
  P.shield = Math.max(0, Math.min(1, (P.shield ?? 1) + (P.state === 'shield' ? -SHIELD_DRAIN : SHIELD_REGEN)));

  if (P.ledge) ledgePlace();
  else { move(P, dt, s => land(s, wasGround)); grabLedge(); }

  // spikes: damage + a pop up and back toward the stage centre, harder the more damage you have; brief i-frames so it's one hit per touch
  if (!(P.inv > 0) && !intangible() && overlaps(P, SPIKES) && P.state === 'shield') { P.shield -= SHIELD_HIT; P.inv = 0.6; hitstop = 4; } // the terminal takes it
  else if (!(P.inv > 0) && !intangible() && overlaps(P, SPIKES)) {
    hurt(SPIKES.dmg); P.inv = 0.6;
    const k = SPIKES.kb, sp = (k.base + k.growth * P.dmg / 100) * KB, a = k.angle * Math.PI / 180;
    P.vx = Math.sign(stage.x + stage.w / 2 - (P.x + P.w / 2)) * sp * Math.cos(a); P.vy = -sp * Math.sin(a);
    P.ground = false; P.on = null; P.ledge = 0; P.fastFall = false; P.airDodged = false; setState('air'); // getting hit refreshes the air dodge
  }

  // attack hitboxes vs the bag: one hit per attack, knockback grows with the bag's damage (and a smash's charge)
  const m = MOVES[P.state], cx = P.x + P.w / 2;
  if (m?.hitbox) {
    const hb = m.hitbox, ox = P.ledge ? 0 : clawdPose().x || 0; // on the ledge, ledgePlace already moved P by the pose's x
    const box = { x: P.face > 0 ? cx + ox + hb.x : cx - ox - hb.x - hb.w, y: P.y + P.h + hb.y, w: hb.w, h: hb.h };
    if (P.f >= m.startup && P.f < m.startup + m.active && bag.hit !== P.state && overlaps(box, bag)) {
      bag.hit = P.state; P.landed = true;
      hitBag(m.damage * (m.chargeMult ? 1 + (m.chargeMult - 1) * P.chg / m.chargeFrames : 1), m.kb, P.face);
    }
  }
  if (!m || P.f < m.startup) { bag.hit = null; P.landed = false; }
  if (m?.projectile && P.f === m.startup) shots.push({ x: cx + P.face * m.projectile.x, y: P.y + P.h + m.projectile.y, vx: P.face * m.projectile.speed, t: 0, m });

  // sparks fly straight until they hit the bag or the stage, or run out of range
  for (let i = shots.length - 1; i >= 0; i--) {
    const sh = shots[i];
    sh.x += sh.vx * dt; sh.t += dt;
    const box = { x: sh.x - SPARK_R, y: sh.y - SPARK_R, w: 2 * SPARK_R, h: 2 * SPARK_R }, hit = overlaps(box, bag);
    if (hit) hitBag(sh.m.damage, sh.m.kb, Math.sign(sh.vx));
    if (hit || overlaps(box, stage) || sh.t > sh.m.projectile.life) shots.splice(i, 1);
  }

  bag.vy = Math.min(bag.vy + G * dt, 950);
  bag.vx -= Math.sign(bag.vx) * Math.min(Math.abs(bag.vx), (bag.ground ? 1800 : 250) * dt); // floor friction / air drag
  bag.hitT = Math.max(0, bag.hitT - dt);
  move(bag, dt, s => { bag.vy = 0; bag.ground = true; bag.on = s; });
  bag.rot = bag.ground ? bag.rot * 0.8 : bag.rot + bag.vx * dt / 80; // tumbles while flying
  if (out(bag)) Object.assign(bag, BAG_SPAWN);

  for (let i = fx.length - 1; i >= 0; i--) if ((fx[i].t += dt / 0.25) >= 1) fx.splice(i, 1);

  if (out(P)) respawn();
}

// damage + knockback on the bag, growing with its damage; bigger hits freeze longer
function hitBag(dmg, kb, dir) {
  dmg *= THINK_POWER[P.think]; // only Claw'd hits the bag, so its effort tier scales every hit
  bag.dmg += dmg; bag.hitT = 0.3;
  hitstop = Math.round(3 + dmg / 4);
  const s = (kb.base + kb.growth * bag.dmg / 100) * KB, a = kb.angle * Math.PI / 180;
  bag.vx = dir * s * Math.cos(a); bag.vy = -s * Math.sin(a);
}

function out(b) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  return cx < BLAST.l || cx > BLAST.r || cy > BLAST.b || cy < BLAST.t;
}

// move a box by its velocity, colliding with the solid stage and landing on pass-through platforms
function move(b, dt, onLand) {
  b.x += b.vx * dt;
  if (overlaps(b, stage)) { b.x = b.x + b.w / 2 < stage.x + stage.w / 2 ? stage.x - b.w : stage.x + stage.w; b.vx = 0; } // out the nearer side (vx can be 0)

  const prevBottom = b.y + b.h;
  b.y += b.vy * dt;
  b.ground = false; b.on = null;
  if (overlaps(b, stage)) {
    if (b.vy > 0) { b.y = stage.y - b.h; onLand(stage); }
    else { b.y = stage.y + stage.h; b.vy = 0; }
  }
  if (b.vy >= 0 && !(b.drop > 0)) for (const pl of plats) {
    if (b.x + b.w > pl.x && b.x < pl.x + pl.w && prevBottom <= pl.y + 0.5 && b.y + b.h >= pl.y) {
      b.y = pl.y - b.h; onLand(pl);
    }
  }
}

// which frame of which animation to show for the current state
function clawdPose() {
  const f = P.f, atk = MOVES[P.state];
  if (atk) { const p = atk.anim(f); if (P.held && f === atk.chargeAt) p.x += P.chg % 4 < 2 ? 1.5 : -1.5; return p; } // tremble while charging
  switch (P.state) {
    case 'idle': return M.idle.anim(f % 120, 120);
    case 'walk': return M.walk.anim(f % 40, 40);
    case 'dash': return M.dash.anim(Math.min(f, 16), 20);
    case 'run': return M.run.anim(f % 24, 24);
    case 'skid': return M.skid.anim(Math.min(Math.floor(P.sk), P.turn ? 25 : 13), 26); // a plain brake holds before the flip
    case 'crouch': return M.crouch.anim(f < 50 ? f : 5 + (f - 5) % 45, 60); // loop the held part
    case 'crouchWalk': return M.crouchWalk.anim(f % 32, 32);
    case 'crouchUp': return M.crouch.anim(Math.min(50 + f, 59), 60);
    case 'squat': return M.jumpSquat.anim(Math.min(6, f * 1.5), 14);
    case 'land': return M.land.anim(Math.min(3 + f, 17), 18);
    case 'landLag': return M.land.anim(Math.min(3 + f * 14 / P.lag, 17), 18); // the landing squash stretched over the lag
    case 'drop': return M.platformDrop.anim(Math.min(8 + f, 30), 40);
    case 'djump': return M.doubleJump.anim(Math.min(3 + f, 28), 36);
    case 'ledgeGrab': return L.ledgeGrab.anim(Math.min(f, 10));
    case 'ledgeHang': return L.ledgeHang.anim(f % 60, 60);
    case 'ledgeGetup': return L.ledgeGetup.anim(Math.min(f, 24));
    case 'ledgeJump': return L.ledgeJump.anim(f);
    case 'ledgeRoll': return L.ledgeRoll.anim(Math.min(f, 35));
    case 'shield': case 'shieldDrop': { // the terminal shrinks a little, cracks and fades as the shield wears down
      const p = D.shield.anim(P.state === 'shieldDrop' ? Math.min(50 + f, 59) : f < 4 ? f : 4 + (f - 4) % 46);
      p.shield *= 0.75 + 0.25 * P.shield; p.wear = 1 - P.shield; return p;
    }
    case 'shieldBreak': return { ...SB.anim(Math.min(f, SB.frames - 1)), oopsMsg: P.oopsMsg };
    case 'airDodge': { const p = D[P.dodgeAnim].anim(Math.min(f, AD.frames - 1)); p.rot = (p.rot || 0) + P.dodgeTilt * Math.min(1, f / 3, Math.max(0, (AD.frames - f) / 10)); return p; }
    case 'spotDodge': case 'rollForward': case 'rollBack': return D[P.state].anim(Math.min(f, D[P.state].frames - 1));
    case 'ledgeDrop': return L.ledgeDrop.anim(Math.min(f, 16));
  }
  if (P.fastFall) return M.fastFall.anim(f % 24, 24);
  if (P.vy > 450) return M.fall.anim(f % 40, 40);
  // rising / floating: pick the jump-arc frame from vertical speed (stretched going up, tucked at the peak, reaching down)
  return M.fullHop.anim(7 + 48 * Math.min(1, Math.max(0, (P.vy + JUMP) / (JUMP + 450))), 64);
}

// ---------- render ----------
function surfaceBelow() {
  const cx = P.x + P.w / 2, feet = P.y + P.h;
  let best = null;
  for (const s of [stage, ...plats]) if (cx > s.x && cx < s.x + s.w && s.y >= feet - 1 && (best === null || s.y < best)) best = s.y;
  return best;
}

function render(t) {
  seed = Math.floor(t * 8) * 7919 + 1;
  ctx.drawImage(paper, 0, 0, W, H);
  ctx.lineCap = ctx.lineJoin = 'round';

  // faint pencil background
  ctx.strokeStyle = INK; ctx.globalAlpha = 0.18; ctx.lineWidth = 1.5;
  ellipse(1040, 150, 62, 62, 2);
  line(40, 470, 330, 440, 3, 1); line(330, 440, 620, 468, 3, 1); line(700, 460, 1000, 430, 3, 1); line(1000, 430, 1240, 462, 3, 1);
  ctx.globalAlpha = 1;

  // main stage
  ctx.fillStyle = '#e3d9c6'; path(stagePoly); ctx.fill();
  ctx.strokeStyle = INK;
  hatch([[240, 532], [1040, 532], [960, 610], [320, 610]]);
  ctx.lineWidth = 2.6; poly(stagePoly, 1.6);
  ctx.lineWidth = 1.4; line(250, 512, 1030, 512, 1.2, 1);

  // spikes
  ctx.fillStyle = '#cfc4b0'; ctx.lineWidth = 2;
  for (let x = SPIKES.x; x < SPIKES.x + SPIKES.w; x += 15) {
    const tri = [[x, SPIKES.y + SPIKES.h], [x + 7.5, SPIKES.y], [x + 15, SPIKES.y + SPIKES.h]];
    path(tri); ctx.fill(); poly(tri, 0.6);
  }

  // platforms
  for (const pl of plats) {
    const r = [[pl.x, pl.y], [pl.x + pl.w, pl.y], [pl.x + pl.w - 8, pl.y + 12], [pl.x + 8, pl.y + 12]];
    ctx.fillStyle = '#e3d9c6'; path(r); ctx.fill();
    hatch(r, 9, 0.35);
    ctx.lineWidth = 2.2; poly(r, 1.3);
  }

  // shadow
  const sy = surfaceBelow();
  if (sy !== null) {
    const dist = sy - (P.y + P.h), s = Math.max(0.25, 1 - dist / 400);
    ctx.globalAlpha = 0.35 * s;
    ctx.fillStyle = 'rgba(42,38,34,0.35)';
    ctx.beginPath(); ctx.ellipse(P.x + P.w / 2, sy, 44 * s, 5 * s, 0, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
  }

  drawBag();
  for (const sh of shots) drawSpark(sh.x, sh.y, SPARK_R * Math.min(1, (sh.m.projectile.life - sh.t) / 0.1), sh.t * 14 * Math.sign(sh.vx)); // shrinks away at max range

  // player (flickers after respawn)
  for (const d of fx) drawDust(d.x, d.y, d.t, d.dir);
  // x / air in poses are preview-only root motion; here physics moves Claw'd
  if (!(P.inv > 0 && Math.floor(t * 14) % 2)) { const pose = clawdPose(); ctx.globalAlpha = intangible() ? 0.5 : 1; drawClawd(P.x + P.w / 2, P.y + P.h, { ...pose, x: P.state in MOVES && !P.ledge ? pose.x : 0, ...powered(pose) }, P.face); ctx.globalAlpha = 1; } // attacks lean and come back

  // hud
  drawHealth();
  if (paused) drawPause(t);
}

// effort tiers stay on Claw'd until KO: its aura, and 5% more size per tier (the neutral special's own pose already has both)
function powered(pose) {
  if (!P.think || P.state === 'neutralSpecial') return {};
  const g = 1 + 0.05 * P.think;
  return { aura: P.think, sx: (pose.sx ?? 1) * g, sy: (pose.sy ?? 1) * g };
}

// burlap sack tied at the neck, shakes when hit, damage % floating above
const SACK = [[-9, -76], [9, -76], [6, -66], [20, -56], [22, -12], [15, 0], [-15, 0], [-22, -12], [-20, -56], [-6, -66]];
function drawBag() {
  const sh = bag.hitT * 14, bx = bag.x + bag.w / 2 + (Math.random() - 0.5) * sh, by = bag.y + bag.h;
  ctx.save();
  ctx.translate(bx, by - bag.h / 2); ctx.rotate(bag.rot); ctx.translate(0, bag.h / 2);
  ctx.fillStyle = '#d8c49a'; path(SACK); ctx.fill();
  ctx.strokeStyle = INK; hatch([[-22, -18], [22, -18], [15, 0], [-15, 0]], 6, 0.3);
  ctx.lineWidth = 2.4; poly(SACK, 1.1);
  ctx.lineWidth = 2; line(-8, -66, 8, -66, 0.8, 1); line(-4, -64, -10, -58, 0.8, 1); // rope tie
  ctx.fillStyle = INK; ctx.fillRect(-9, -44, 4, 7); ctx.fillRect(5, -44, 4, 7); // eyes
  ctx.restore();
  ctx.font = '700 30px Caveat, cursive'; ctx.textAlign = 'center'; ctx.lineWidth = 3;
  const pct = Math.round(bag.dmg) + '%';
  ctx.strokeText(pct, bx, bag.y - 12); ctx.fillStyle = dmgColor(bag.dmg); ctx.fillText(pct, bx, bag.y - 12);
  ctx.textAlign = 'left';
}

function drawHealth() {
  const sh = P.hitT * 16, bx = W - 120 + (Math.random() - 0.5) * sh, by = 70 + (Math.random() - 0.5) * sh, R = 38; // shakes when hit
  ctx.fillStyle = dmgColor(P.dmg); ctx.beginPath(); ctx.arc(bx, by, R, 0, 6.28); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ellipse(bx, by, R, R, 1.2);
  ctx.save(); ctx.translate(bx, by); ctx.scale(0.8, 0.8); drawClawd(0, 5 * CV / 2); ctx.restore(); // centred inside
  // damage %, overlapping the circle's bottom right, filled with the same colour
  ctx.font = '700 36px Caveat, cursive'; ctx.lineWidth = 3.5; ctx.textAlign = 'left'; // grows rightward, away from the circle
  const pct = Math.round(P.dmg) + '%', tx = bx + 12, ty = by + R + 6;
  ctx.strokeText(pct, tx, ty); ctx.fillStyle = dmgColor(P.dmg); ctx.fillText(pct, tx, ty);
  // stocks: filled pip = life left, wrapping the circle's bottom-left quarter, starting at the bottom
  for (let i = 0; i < STOCKS; i++) {
    const a = Math.PI / 2 - 0.04 + i * 0.38, px = bx + (R + 11) * Math.cos(a), py = by + (R + 11) * Math.sin(a);
    if (i < stocks) { ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(px, py, 5, 0, 6.28); ctx.fill(); }
    ctx.lineWidth = 1.6; ellipse(px, py, 5, 5, 0.5);
  }
}

function drawPause(t) {
  // home: clean paper with ink; pause / game over: the frozen game dimmed with light text
  if (home) ctx.drawImage(paper, 0, 0, W, H);
  else { ctx.fillStyle = 'rgba(38,35,31,0.8)'; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = ctx.strokeStyle = home ? INK : '#efe7d6'; ctx.textAlign = 'center';
  if (home && !showControls) {
    ctx.save(); ctx.translate(W / 2, H / 2 - 52); ctx.scale(1.5, 1.5); drawClawd(0, 0, { ...M.idle.anim(Math.floor(t * 60) % 120, 120), x: 0 }); ctx.restore();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; line(W / 2 - 110, H / 2 - 50, W / 2 + 110, H / 2 - 50, 1.2, 1);
    ctx.fillStyle = INK;
  } else { ctx.font = '700 84px Caveat, cursive'; ctx.fillText(over ? 'game over' : showControls ? 'controls' : 'paused', W / 2, H / 2 - 70); }
  if (showControls) {
    ctx.font = '600 32px Caveat, cursive';
    CONTROLS.forEach(([k, d], i) => {
      const y = H / 2 - 5 + i * 42;
      ctx.textAlign = 'right'; ctx.globalAlpha = 1; ctx.fillText(k, W / 2 - 150, y);
      ctx.textAlign = 'left'; ctx.globalAlpha = 0.75; ctx.fillText(d, W / 2 - 110, y);
    });
    ctx.textAlign = 'center';
  } else {
    ctx.font = '600 40px Caveat, cursive';
    menu.forEach((m, i) => {
      ctx.globalAlpha = i === sel ? 1 : 0.5;
      ctx.fillText((i === sel ? '›  ' : '') + m + (i === sel ? '  ‹' : ''), W / 2, H / 2 + 10 + i * 52);
    });
  }
  ctx.globalAlpha = 0.6; ctx.font = '600 22px Caveat, cursive';
  ctx.fillText(showControls ? 'Esc / Enter / click  back' : '↑ ↓ choose · Enter / Space / click select' + (over || home ? '' : ' · Esc resume'), W / 2, H / 2 + 250);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  if (paused) acc = 0;
  while (!paused && acc >= STEP) { update(STEP); acc -= STEP; } // game over can pause mid-frame
  cv.style.translate = hitstop > 0 ? `${(Math.random() - 0.5) * 6}px ${(Math.random() - 0.5) * 6}px` : ''; // shake during hit freeze
  render(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
